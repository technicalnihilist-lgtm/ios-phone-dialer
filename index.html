<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Phone">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Phone</title>
<style>
:root{
  --bg:#000;--label:#fff;--label2:rgba(235,235,245,.6);
  --fill:rgba(120,120,128,.32);--fill-press:rgba(120,120,128,.52);
  --sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--red:#ff453a;
  --card:#1c1c1e;--glassbg:rgba(44,44,48,.62);--glassline:rgba(255,255,255,.12);
  --tabsel:rgba(255,255,255,.16);
  --safe-b:env(safe-area-inset-bottom,0px);
  /* clamp() is Chrome 79. On anything older the whole declaration is dropped,
     --k and --gap stay unset, and every rule built on them — the three-column
     grid, the key diameter, the row gaps — becomes invalid and falls back to
     auto: the keypad draws as a single column of unstyled buttons. A plain px
     value first, the clamp after it, so an engine that knows clamp() is
     untouched and one that does not still gets a keypad. */
  --k:64px;--k:clamp(62px,19.1vw,75px);
  --gap:22px;--gap:clamp(16px,6.6vw,26px);
  --vgap:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#fff;--label:#000;--label2:rgba(60,60,67,.6);
    --fill:rgba(120,120,128,.19);--fill-press:rgba(120,120,128,.32);
    --sep:rgba(60,60,67,.25);--blue:#007aff;--green:#34c759;--red:#ff3b30;
    --card:#f2f2f7;--glassbg:rgba(248,248,250,.72);--glassline:rgba(0,0,0,.07);
    --tabsel:rgba(255,255,255,.75);
    color-scheme:light;
  }
}
@media (max-height:700px){:root{--k:60px;--vgap:10px;--gap:20px}}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  background:#000;color:var(--label);overflow:hidden;display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit}

/* ---------- device ---------- */
.device{
  /* 100dvh is Chrome 108. Where it is not understood the declaration is
     dropped, .device has no height at all, and the shell collapses to the
     status bar: the keypad, the tab bar and every list are laid out below the
     visible area. The vh fallback comes first and the dvh line after it, so a
     browser that knows dvh keeps it and one that does not still fills the
     screen. */
  position:relative;width:100vw;height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
.island{display:none}
@media (min-width:520px){
  body{background:radial-gradient(120% 90% at 50% 0%,#1b1b21 0%,#0a0a0c 55%,#000 100%)}
  .device{
    width:393px;height:852px;border-radius:56px;padding-top:0;
    box-shadow:0 0 0 11px #0b0b0c,0 0 0 12.5px #3a3a3d,0 0 0 13.5px #101012,0 46px 90px rgba(0,0,0,.72);
  }
  .island{
    display:block;position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:122px;height:35px;border-radius:19px;background:#000;z-index:70;
  }
}

/* ---------- status bar ---------- */
.statusbar{
  flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 32px;font-size:16px;font-weight:600;letter-spacing:.1px;
  color:var(--label);position:relative;z-index:40;
}
@media (max-height:700px){.statusbar{height:44px}}
.statusbar .time{font-variant-numeric:tabular-nums;min-width:54px}
.device.calling .statusbar{color:#fff}
.empty{
  padding:56px 24px;text-align:center;color:var(--label2);
  font-size:17px;line-height:1.4;
}

/* ---------- app ---------- */
.app{flex:1;position:relative;min-height:0;z-index:10}
.view{
  /* inset is Chrome 87. Without it an absolutely positioned view has no box:
     no top, no height, nothing to scroll. Longhands first, shorthand last. */
  position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:none;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none}
.app[data-view=keypad]    #v-keypad{display:flex}
.app[data-view=favorites] #v-favorites{display:block}
.app[data-view=recents]   #v-recents{display:block}
.app[data-view=contacts]  #v-contacts{display:block}
.app[data-view=voicemail] #v-voicemail{display:block}

/* ---------- keypad ---------- */
#v-keypad{
  flex-direction:column;align-items:center;overflow:hidden;
  padding:0 24px calc(96px + var(--safe-b));
}
.dialtop{
  width:100%;flex:none;padding-top:14px;min-height:104px;
  text-align:center;position:relative;
}
.number{
  display:block;width:100%;height:50px;line-height:50px;
  font-size:40px;font-weight:400;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;color:var(--label);font-variant-numeric:tabular-nums;
  transition:font-size .08s linear;
}
.addnum{
  display:none;margin:2px auto 0;padding:5px 12px;border:0;background:none;
  font-size:17px;color:var(--blue);cursor:pointer;border-radius:8px;
}
.addnum.show{display:inline-block}
.addnum:active{opacity:.5}
.match{
  display:none;align-items:center;justify-content:center;gap:9px;margin:6px auto 0;
  background:none;border:0;padding:4px 10px;cursor:pointer;border-radius:12px;
  width:max-content;max-width:100%;
}
.match.show{display:flex}
.match .av{width:30px;height:30px;font-size:12px}
.match span.mn{font-size:17px;color:var(--label)}
.match:active{opacity:.55}

.pad{
  display:grid;grid-template-columns:repeat(3,var(--k));gap:var(--vgap) var(--gap);
  margin-top:auto;
}
.key{
  width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:var(--fill);color:var(--label);cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  padding:0;transition:background .13s ease,transform .13s cubic-bezier(.3,1.5,.5,1);
}
.key b{
  font-size:calc(var(--k)*.47);font-weight:400;line-height:1;letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.key small{
  font-size:10px;font-weight:600;letter-spacing:1.7px;line-height:12px;height:12px;
  margin-top:2px;color:var(--label2);text-transform:uppercase;
}
.key.sym b{font-size:calc(var(--k)*.58);padding-top:5px}
.key.sym small{visibility:hidden}
.key:active{background:var(--fill-press);transform:scale(1.055)}
.key:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.callrow{
  flex:none;display:grid;grid-template-columns:repeat(3,var(--k));
  gap:0 var(--gap);justify-items:center;margin-top:calc(var(--vgap) + 8px);
  padding-bottom:4px;
}
.call{
  grid-column:2;width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:var(--green);display:grid;place-items:center;cursor:pointer;
  transition:filter .13s,transform .13s cubic-bezier(.3,1.5,.5,1);
}
.call svg{width:calc(var(--k)*.42);height:calc(var(--k)*.42);fill:#fff}
.call:active{filter:brightness(1.18);transform:scale(1.05)}
.del{
  grid-column:3;width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:none;display:grid;place-items:center;color:var(--label);cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.del.show{opacity:1;pointer-events:auto}
.del:active{opacity:.45}
.del svg{
  width:calc(var(--k)*.44);height:calc(var(--k)*.44);fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- shared list bits ---------- */
.hdr{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:6px 16px 8px 20px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--bg) 72%,transparent);
}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:0;line-height:1.15}
.hdr button{
  border:0;background:none;color:var(--blue);font-size:17px;padding:4px 0 6px;cursor:pointer;
}
.hdr button:active{opacity:.5}
.av{
  width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
  background:linear-gradient(160deg,var(--a),var(--b));
}
.seg{
  display:flex;gap:0;margin:2px 16px 10px;padding:2px;border-radius:9px;
  background:var(--fill);position:relative;
}
.seg button{
  flex:1;border:0;background:none;font-size:13px;font-weight:600;color:var(--label);
  padding:6px 0;border-radius:7px;cursor:pointer;position:relative;z-index:1;
  transition:color .2s;
}
.seg button:not(.on){color:var(--label2)}
.seg .segpill{
  position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--card);
  box-shadow:0 3px 8px rgba(0,0,0,.18);transition:left .28s cubic-bezier(.3,1.2,.4,1),width .28s cubic-bezier(.3,1.2,.4,1);
}
@media (prefers-color-scheme:light){.seg .segpill{background:#fff}}

.list{background:var(--card);margin:0 16px;border-radius:14px;overflow:hidden}
.list.plain{background:none;margin:0}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;
  background:none;border:0;text-align:left;cursor:pointer;min-height:53px;position:relative;
}
.row:active{background:var(--fill)}
.row+.row::before{
  content:"";position:absolute;left:66px;right:0;top:0;height:.5px;background:var(--sep);
}
.row .av{width:40px;height:40px}
.row .t{flex:1;min-width:0;line-height:1.25}
.row .t b{display:block;font-size:17px;font-weight:400;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.missed .t b{color:var(--red)}
.row time{font-size:15px;color:var(--label2);flex:none;margin-left:6px}
.row .info{
  width:26px;height:26px;border-radius:50%;border:0;background:none;flex:none;
  display:grid;place-items:center;color:var(--blue);cursor:pointer;
}
.row .info svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}

.sec{
  font-size:13px;font-weight:600;color:var(--label2);padding:11px 16px 3px 20px;
  letter-spacing:.4px;background:var(--bg);
}

/* favorites */
.favs{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:2px 16px 8px}
.fav{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 13px;
  border:0;border-radius:18px;background:var(--card);cursor:pointer;text-align:center;
}
.fav:active{background:var(--fill)}
.fav .av{width:54px;height:54px;font-size:20px;margin-bottom:7px}
.fav b{font-size:16px;font-weight:500;color:var(--label)}
.fav small{font-size:12px;color:var(--label2)}

/* contacts search */
.searchwrap{padding:0 16px 12px}
.search{
  display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;
  padding:7px 9px;color:var(--label2);
}
.search svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.search input{
  border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);
  width:100%;padding:0;-webkit-appearance:none;
}
.search input::placeholder{color:var(--label2)}

/* voicemail */
.vm .play{
  width:34px;height:34px;border-radius:50%;border:0;background:none;flex:none;
  display:grid;place-items:center;color:var(--blue);cursor:pointer;
}
.vm .play svg{width:22px;height:22px;fill:currentColor}
.vm .t b{font-weight:600}
.vm .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute;left:9px;right:9px;bottom:calc(8px + var(--safe-b));height:60px;
  display:flex;align-items:center;border-radius:30px;z-index:30;
  background:var(--glassbg);border:.5px solid var(--glassline);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 8px 26px rgba(0,0,0,.28);
  touch-action:none;overflow:hidden;
}
.tabbar .pill{
  position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:25px;z-index:0;
  pointer-events:none;background:var(--tabsel);
  box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.28);
  transition:left .42s cubic-bezier(.32,1.4,.42,1),width .42s cubic-bezier(.32,1.4,.42,1),transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;
}
.tabbar .pill.noanim{transition:none!important}
.tabbar .pill.grab{transform:scale(1.06);opacity:.9}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:0;border:0;background:none;cursor:pointer;position:relative;z-index:1;
  color:var(--label2);transition:color .2s;height:100%;
}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500;letter-spacing:.1px}
.tab.on{color:var(--label)}

/* ---------- call screen ---------- */
.callscreen{
  position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:35;display:flex;flex-direction:column;
  padding:70px 26px calc(34px + var(--safe-b));
  transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.9,.24,1);
  background:
    radial-gradient(90% 60% at 50% 0%,#3a3a44 0%,transparent 70%),
    linear-gradient(#101014,#050506);
  color:#fff;
}
.callscreen.show{transform:none}
.cs-top{text-align:center;flex:none;padding-top:26px}
.cs-name{font-size:34px;font-weight:400;letter-spacing:-.3px;margin-bottom:6px}
.cs-status{font-size:17px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.cs-actions{
  margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px 8px;justify-items:center;padding-bottom:34px;
}
.cs-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:0;background:none;color:#fff;cursor:pointer;font-size:11px;
}
.cs-btn i{
  width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:background .15s,transform .15s;
}
.cs-btn:active i{background:rgba(255,255,255,.3);transform:scale(.96)}
.cs-btn.on i{background:#fff}
.cs-btn.on i svg{stroke:#000;fill:#000}
.cs-btn svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cs-end{
  align-self:center;width:70px;height:70px;border-radius:50%;border:0;background:#ff453a;
  display:grid;place-items:center;cursor:pointer;flex:none;
}
.cs-end svg{width:32px;height:32px;fill:#fff;transform:rotate(135deg)}
.cs-end:active{filter:brightness(1.15)}

/* install card */
.install{
  position:absolute;left:10px;right:10px;bottom:calc(78px + var(--safe-b));z-index:34;
  display:none;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;
  background:var(--glassbg);border:.5px solid var(--glassline);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:13px;line-height:1.3;color:var(--label);
}
.install.show{display:flex}
.install span{flex:1}
.install b{font-weight:600}
.install button{
  border:0;background:none;color:var(--blue);font-size:14px;font-weight:600;
  padding:4px 6px;cursor:pointer;flex:none;
}
.install #installX{color:var(--label2);font-size:20px;line-height:1;padding:0 2px}

/* paste menu */
.menu{
  position:absolute;z-index:90;display:none;transform-origin:50% 0;
  background:var(--glassbg);border:.5px solid var(--glassline);border-radius:13px;
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden;min-width:190px;
  animation:menuIn .18s cubic-bezier(.3,1.4,.5,1) both;
}
.menu.show{display:block}
.menu button{
  display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;
  font-size:16px;color:var(--label);cursor:pointer;
}
.menu button:active{background:var(--fill)}

/* The 0.3s slide transition that used to run the page change lived here, as a
   duration/timing pair plus an animation-name pointing at the two keyframes
   below. The spring transition further down sets the whole `animation`
   shorthand on the same selector (`.app.goR .view` / `.app.goL .view`, same
   specificity, later in the sheet), and a shorthand resets every longhand it
   covers — name, duration, timing function and fill mode all of them. So these
   five lines had not had any effect since that block was written: they only
   made it look as though the page transition ran twice at two speeds. Removed
   together with the two keyframes nothing else referenced. */

@media (prefers-reduced-motion:reduce){
  /* A universal selector matches elements and never a pseudo-element, and the
     one animation in this app that runs without end lives on one: the ambient
     layer behind the glass, `.app::before`, drifts on a 14 s loop for the whole
     life of the page. It was therefore the single piece of motion the setting
     did not reach — the keypad, the tab bar, the sheets and the call screen all
     snapped, while the blurred colour behind them went on sliding about, which
     is exactly the motion this preference exists to stop. Name the two
     pseudo-elements so the rule covers what it was written to cover. */
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  /* ...and the drift must be stopped rather than shortened: it is `infinite
     alternate`, so a 1 ms duration would not end it but loop it a thousand
     times a second, leaving the layer at an arbitrary point of the cycle on
     every frame — a blurred full-width gradient jittering, and repainting, for
     the users who asked for the least motion. One iteration is not enough
     either (the fill would be dropped and the layer would snap back); drop the
     animation, and the layer holds its un-animated position and its gradient. */
  .app::before{animation:none!important}
}

/* ===== spring physics + liquid glass layer ===== */
:root{
  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring-soft:cubic-bezier(.22,1.2,.36,1);
  --spring-sheet:cubic-bezier(.22,1,.36,1);
  --glassbg:rgba(70,70,78,.34);
  --glassedge:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.07);
}
@media (prefers-color-scheme:light){:root{
  --glassbg:rgba(255,255,255,.44);
  --glassedge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.35);
}}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,0.024,0.089,0.18,0.287,0.402,0.516,0.626,0.726,0.815,0.891,0.953,1.003,1.04,1.067,1.083,1.092,1.095,1.092,1.086,1.077,1.067,1.056,1.045,1.035,1.025,1.017,1.01,1.004,0.999,0.996,0.994,0.992,0.991,0.991,0.991,0.992,0.993,0.994,0.995,0.996,0.997,0.998,0.998,0.999,1,1);--spring-soft:linear(0,0.016,0.057,0.117,0.188,0.267,0.348,0.429,0.508,0.582,0.651,0.713,0.769,0.818,0.861,0.897,0.928,0.954,0.974,0.991,1.003,1.013,1.02,1.024,1.027,1.028,1.028,1.028,1.026,1.024,1.022,1.02,1.018,1.015,1.013,1.011,1.009,1.007,1.006,1.005,1.004,1.003,1.002,1.001,1.001,1,1);--spring-sheet:linear(0,0.014,0.05,0.103,0.166,0.236,0.309,0.383,0.455,0.524,0.588,0.648,0.703,0.752,0.795,0.834,0.867,0.896,0.921,0.942,0.959,0.973,0.984,0.993,1,1.006,1.01,1.012,1.014,1.015,1.015,1.015,1.014,1.014,1.013,1.012,1.011,1.009,1.008,1.007,1.006,1.005,1.005,1.004,1.003,1.003,1)}
}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(130%) scale(.92)}to{opacity:1;transform:none}}
@keyframes iconPop{from{transform:scale(.65) translateY(3px)}to{transform:none}}
@keyframes tap{from{transform:scale(.82)}to{transform:none}}
@keyframes menuIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes vIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*46px)) scale(.93)}to{opacity:1;transform:none}}
@keyframes vOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(calc(var(--dir,1)*-38px)) scale(.93)}}
@keyframes drift{from{transform:translate3d(-4%,0,0) scale(1)}to{transform:translate3d(4%,-6%,0) scale(1.12)}}

/* ambient colour behind the glass so the blur has something to refract */
.app::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-10%;height:58%;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 50% at 24% 62%,rgba(10,132,255,.38),transparent 70%),radial-gradient(36% 46% at 76% 72%,rgba(191,90,242,.32),transparent 70%);
  filter:blur(12px);animation:drift 14s ease-in-out infinite alternate}
/* the drift loop is endless by design, but while the page is hidden it kept a
   blurred layer — and every backdrop-filter sitting above it — repainting for
   nobody, on battery. Paused there; resumed exactly as it was on return. */
.app.still::before{animation-play-state:paused}
/* the in-call sheet is opaque and covers the whole app, so the ambient blobs
   behind it kept a blurred full-screen layer repainting every frame for the
   entire length of every call, where nobody could see them */
.device.calling .app::before{animation-play-state:paused}
@media (prefers-color-scheme:light){.app::before{opacity:.55}}
.app{transition:transform .8s var(--spring-soft),filter .5s ease}
.device.calling .app{transform:scale(.92);filter:brightness(.55)}
.view:not(#v-keypad){padding-bottom:calc(96px + var(--safe-b))}

/* page transitions: old page leaves, new page springs in */
.app.goR{--dir:1}.app.goL{--dir:-1}
.app.goR .view,.app.goL .view{animation:vIn .8s var(--spring-soft) backwards}
.app.goR .view.leaving,.app.goL .view.leaving{display:block;pointer-events:none;z-index:0;animation:vOut .28s ease both}
#v-keypad.leaving{display:flex}
.app.goR .row,.app.goL .row{animation:rowIn .8s var(--spring-soft) backwards}
.app.goR #v-keypad .key,.app.goL #v-keypad .key{animation:pop .85s var(--spring) backwards;animation-delay:calc(var(--n,0)*24ms)}
.app.goR .fav,.app.goL .fav{animation:pop .85s var(--spring) backwards}
.fav:nth-child(2){animation-delay:.04s!important}.fav:nth-child(3){animation-delay:.08s!important}.fav:nth-child(4){animation-delay:.12s!important}

/* press = squash, release = spring back */
.key{transition:background .4s ease,transform .75s var(--spring)}
.key:active{transform:scale(.9);transition:background 0s,transform .12s ease-out}
.call{transition:filter .3s,transform .75s var(--spring)}
.call:active{transform:scale(.88);transition:filter 0s,transform .12s ease-out}
.fav,.cs-end,.hdr button,.addnum,.match{transition:transform .75s var(--spring),background .3s,opacity .3s}
.fav:active,.cs-end:active,.hdr button:active,.addnum:active,.match:active{transform:scale(.92);transition:transform .12s ease-out}
.del{transform:scale(.4);transition:opacity .25s ease,transform .75s var(--spring)}
.del.show{transform:none}
.row{transition:background .35s ease}
.row:active{transition:background 0s}
.match.show,.addnum.show{animation:pop .65s var(--spring) backwards}
.tab.on svg{animation:iconPop .8s var(--spring) backwards}
.cs-btn i{transition:background .3s,transform .75s var(--spring)}
.cs-btn:active i{transform:scale(.88);transition:background 0s,transform .12s ease-out}
.cs-btn.on i{animation:tap .7s var(--spring)}
.seg .segpill{transition:left .65s var(--spring),width .65s var(--spring)}
.seg .segpill.noanim{transition:none!important}

/* liquid glass */
.tabbar{
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02)),var(--glassbg);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.08);backdrop-filter:blur(22px) saturate(200%) brightness(1.08);
  box-shadow:var(--glassedge),0 12px 32px rgba(0,0,0,.32);
  animation:rise .95s var(--spring-soft) backwards;
}
.tabbar .pill{
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));
  box-shadow:var(--glassedge),0 2px 8px rgba(0,0,0,.18);
  transition:left .75s var(--spring),width .75s var(--spring),transform .6s var(--spring),opacity .2s;
}
.tabbar .pill.grab{transform:scale(1.12);opacity:1}
.menu,.install{box-shadow:var(--glassedge),0 12px 34px rgba(0,0,0,.35)}
.menu{animation:menuIn .6s var(--spring) both}
.install.show{animation:rise .9s var(--spring-soft) backwards}
.cs-btn i{box-shadow:var(--glassedge)}

/* call screen: spring sheet (extended below the edge so overshoot never shows a gap) */
.callscreen{
  top:0;right:0;bottom:-90px;left:0;inset:0 0 -90px 0;padding-bottom:calc(124px + var(--safe-b));
  transform:translateY(105%) scale(.96);visibility:hidden;
  transition:transform .8s var(--spring-sheet),visibility 0s .8s;
}
.callscreen.show{transform:none;visibility:visible;transition:transform .8s var(--spring-sheet),visibility 0s}
.callscreen.show .cs-btn{animation:pop .85s var(--spring) backwards}
.callscreen.show .cs-end{animation:pop .9s var(--spring) .55s backwards}
.callscreen.show .cs-top{animation:rowIn .9s var(--spring-soft) .1s backwards}
.callscreen.show .cs-btn:nth-child(1){animation-delay:0.13s}.callscreen.show .cs-btn:nth-child(2){animation-delay:0.18s}.callscreen.show .cs-btn:nth-child(3){animation-delay:0.23s}.callscreen.show .cs-btn:nth-child(4){animation-delay:0.28s}.callscreen.show .cs-btn:nth-child(5){animation-delay:0.33s}.callscreen.show .cs-btn:nth-child(6){animation-delay:0.38s}

/* ===== glass settings ===== */
:root{
  --g-rgb:70,70,78;--g-a:.34;--g-blur:22px;--g-sat:200%;--g-edge:1;--g-glow:1;
  --glassbg:rgba(var(--g-rgb),var(--g-a));
  --glassedge:inset 0 1px 0 rgba(255,255,255,calc(.4*var(--g-edge))),inset 0 -1px 0 rgba(255,255,255,calc(.07*var(--g-edge))),inset 1px 0 0 rgba(255,255,255,calc(.14*var(--g-edge))),inset -1px 0 0 rgba(255,255,255,calc(.14*var(--g-edge))),inset 0 0 22px rgba(255,255,255,calc(.07*var(--g-edge)));
  --sheetbg:rgba(38,38,44,.74);
}
@media (prefers-color-scheme:light){:root{
  --g-rgb:255,255,255;
  --glassedge:inset 0 1px 0 rgba(255,255,255,calc(.95*var(--g-edge))),inset 0 -1px 0 rgba(255,255,255,calc(.4*var(--g-edge))),inset 0 0 22px rgba(255,255,255,calc(.35*var(--g-edge)));
  --sheetbg:rgba(250,250,252,.8);
}}
.tabbar,.menu,.install{
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(1.08);
  backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(1.08);
}
.app::before{opacity:var(--g-glow)}
@media (prefers-color-scheme:light){.app::before{opacity:calc(var(--g-glow)*.55)}}

#v-keypad .keypad-tools{width:100%;flex:none;display:flex;justify-content:flex-end;padding:0 2px 12px;margin-top:auto}
#v-keypad .pad{margin-top:0}
.gear{
  width:34px;height:34px;border:0;border-radius:50%;background:var(--fill);color:var(--label);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--glassedge);transition:transform .75s var(--spring);
}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.gear:active{transform:scale(.86);transition:transform .12s ease-out}
.gear.on{transform:rotate(90deg)}
.device.calling .gear{visibility:hidden}

.gsheet{
  position:absolute;left:10px;right:10px;bottom:calc(80px + var(--safe-b));z-index:32;
  padding:14px 16px 10px;border-radius:26px;background:var(--sheetbg);
  border:.5px solid var(--glassline);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--glassedge),0 18px 48px rgba(0,0,0,.4);
  transform:translateY(40px) scale(.9);transform-origin:50% 100%;opacity:0;visibility:hidden;
  /* The fade-out is .25s but `visibility` was held at `visible` for the whole
     .8s spring, so for the .55s in between the sheet was invisible and still
     hit-tested: its box (top to bottom of the keypad's lower rows and the
     green Call button) swallowed every tap made right after tapping Done.
     Nothing about how it looks changes — a closed sheet simply stops taking
     input the moment it stops being drawn. */
  pointer-events:none;
  transition:transform .8s var(--spring),opacity .25s ease,visibility 0s .8s;
}
.gsheet.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .8s var(--spring),opacity .25s ease,visibility 0s}
.gs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gs-h b{font-size:17px;font-weight:600}
.gs-h button{border:0;background:none;color:var(--blue);font-size:17px;font-weight:600;cursor:pointer;padding:2px 4px;transition:transform .7s var(--spring)}
.gs-h button:active{transform:scale(.9);transition:transform .12s}
.gs-pre{display:flex;gap:8px;margin-bottom:6px}
.gs-pre button{
  flex:1;border:0;border-radius:12px;padding:8px 0;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--fill);color:var(--label);transition:transform .7s var(--spring),background .2s;
}
.gs-pre button:active{transform:scale(.92);background:var(--fill-press);transition:transform .12s,background 0s}
.gs-row{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0 0}
.gs-row label{font-size:14px}
.gs-row output{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.gs-row input{grid-column:1/-1;width:100%;height:28px;margin:0;background:none;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.gs-row input::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--blue) var(--p,50%),var(--fill) var(--p,50%))}
.gs-row input::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,0,0,.1);transition:transform .7s var(--spring);
}
.gs-row input:active::-webkit-slider-thumb{transform:scale(1.18)}
.gs-row input::-moz-range-track{height:5px;border-radius:3px;background:var(--fill)}
.gs-row input::-moz-range-progress{height:5px;border-radius:3px;background:var(--blue)}
.gs-row input::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
</style>

<script>
"use strict";

/* ---------------- data ---------------- */
/* no sample contacts — the Android build fills this from the device */
const people = [];

const recents = [];

const voicemails = [];

/* A generation number for the contact data: bumped by every rebuild of the
   search index, which is the only thing that can change what the book contains.
   Everything derived from the book — the Contacts markup, the keypad's contact
   match — is keyed on it, so a cached answer can never outlive the data it came
   from. */
let contactGen = 0;

/* the replacement table was rebuilt for every character that needed escaping, and
   every list render escapes every name and number it draws — a fresh object per
   escaped character, thousands of them for a large address book. Hoisted. */
const ESC_MAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
/* the pattern was written as a literal inside esc(), and a regex literal is a
   fresh RegExp object every time it is evaluated — one allocation per escaped
   value, and every row of every list escapes its name, its number and its
   subtitle, on every keystroke in the search box. Hoisted beside the table it
   indexes, so the hot path does the replace and nothing else. String.replace
   with a global regex resets lastIndex itself, so sharing it is safe. */
const ESC_RE = /[&<>"']/g;
const esc = v => String(v == null ? "" : v).replace(ESC_RE, c => ESC_MAP[c]);
/* The characters that take up no room at all: a soft hyphen, a zero-width space,
   joiner or non-joiner, the direction marks, a word joiner and a byte order
   mark. A name copied out of a web page, a PDF or a chat carries them, and the
   avatar of a name that begins with one drew nothing at all, because the first
   "character" of the name was a character with no shape. */
/* ...but the direction marks are only two of the seven characters that set the
   direction of the text around them, and the five that were missing are the ones
   an RTL name is most often wrapped in: the Arabic letter mark (U+061C) and the
   four isolates — first-strong, left-to-right, right-to-left and pop (U+2066 to
   U+2069). A vCard, or a contact synced from an app that stores an Arabic or
   Hebrew name with its direction pinned, arrives as U+2067 + the name + U+2069,
   and none of the three was stripped. The name then began with a character with
   no shape, so the avatar drew the isolate and nothing else: a four-letter
   Arabic name in that form drew a blank circle, and the same name with a second
   word after it drew the initial of the second word instead of the first. The
   section header above the row was an empty strip with a row under it, which is
   the same defect the two direction marks already in this table were put here
   to fix.
   U+180E, the Mongolian vowel separator, is the other one: Unicode reclassified
   it from a space to a format character and it has had no width since, so it is
   invisible wherever it appears. */
/* ZWNJ and ZWJ are deliberately not in this list: they carry no shape of their

/* everything a row's markup is built from: the name it draws and is filed under,
   the number, and the avatar pair. Two contacts that agree on all of them draw
   the same row, so the entry (and its cached markup) can be kept as it is. */
/* ...but it has to be the name the row actually DRAWS, not the normalised one
   it is filed and searched under. rowMarkup() writes p.n as it is stored, and
   data-name carries the same string, so a contact whose name changed only in
   whitespace — a double space that collapsed on a re-sync, a leading space that
   was fixed, a non-breaking space that came back as an ordinary one — produced
   the identical key and kept the previous entry and its cached markup: the list
   went on drawing the old name, and a call placed from that row was written into
   Recents under it. Key on the raw name; the normalised one is only ever a
   search key. It is also one regex pass per contact less on the load path. */
const contactKey = p => {
  const c = avColors(p.c);
  return String(p.n == null ? "" : p.n) + "\u0000" + String(p.t == null ? "" : p.t) + "\u0000" + c[0] + "\u0000" + c[1];

/* the key computed for each contact while the "is this the same book?" scan
   runs, kept so the pass below does not have to build every one of them a second
   time. Scratch, reused across hydrates, and emptied before it can pin a
   generation of names. */
const keyBuf = [];
function buildContactIdx() {
  let count = 0, same = idxKeys !== null;

    const p = people[i];
    if (!p) continue;
    count++;

       contact — once here and once more in the loop below, on the same
       contacts, in the same order. A hydrate is the common case (the boot
       read, a permission result, every return to the foreground), and on a
       3000-contact book the second pass cost about 1.5 ms of the 11.2 ms the
       fast path took. Build the key once and keep it. */
    if (same) {

     index would then be one entry short of */

    /* the same contacts, so the same rows in the same order: keep the index,
       keep the markup cached on its entries, and keep shownRows pointing at
       them so renderContacts() can still answer "already on screen". Only the
       person objects are new — point the entries at those, so the previous
       generation can be collected instead of being pinned by the index. */
    let k = 0;
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      if (!p) continue;
      const e = idxKeys.get(keyBuf[k++]);
      if (e) e.p = p;

    const tel = String(p.t == null ? "" : p.t);

       from the wrong character everywhere it mattered: the section header came

       here and use the trimmed name for the header, the search key and the
       ordering alike; the row itself still shows the name as it is stored. */

       ends. "Alice\u00a0Adams" (a non-breaking space, which is what a lot of synced

       name exactly as it is stored — only the key it is found by changes. */
    const name = normSpace(p.n);

      p: p,

         dials; search needs the second one */

      /* the section header this row falls under: the name cannot change, so it

         fixed for. Take the whole first code point. */

     holds the *previous* generation's entries — each one carrying the markup it
     cached. On a 3000-contact book that pins about 700 kB of dead row markup
     after every reload (a permission result, a return to the foreground, a
     renderer restart) until the Contacts tab is drawn again, which with the tab
     closed may be never. Drop it here: the entries are new objects, so the
     identity check in renderContacts() can only ever answer "different". */

     renderContacts() fills while it walks the index. It is emptied at the start
     of the *next* render, not at the end of the last one, so with the Contacts
     tab closed the old entries stayed in it for good: every entry, its cached
     row markup, the person object behind it and the initials/T9/dial-digits
     cached for that object. That is the whole previous address book, kept alive
     beside the new one — exactly what the line above was added to stop. Clear it
     with shownRows; the next render refills it from the new index. */

     from the new entries the next time it is drawn (shownRows is null, so it
     always is), and until then #contacts held every one of the old buttons — a
     few thousand nodes on a real address book. Only drop them when the Contacts
     tab is not the one on screen; when it is, hydrateNative() re-renders the
     list in this same task, and clearing first would only cost an extra parse. */
  if (app.dataset.view !== "contacts") $("contacts").innerHTML = "";
}
/*
 * The markup of one row depends only on the contact it draws, and a contact

 * It was rebuilt — two escapes, an avatar and a template — for every entry on
 * every keystroke in the search box: measured at 55–60 ms for a 3000-contact
 * book, on the main thread, every time the query changed. Built once per contact,
 * on the first render that actually needs it, so a data load pays nothing for
 * contacts nobody has looked at yet, and every later render is a concatenation
 * (0.7–0.9 ms for the same 3000 rows).

    e.html = html;

       header was the one that did not, so a contact whose name starts with "<"

     word. "rao " used to be looked for verbatim, matched no key, and emptied
     the list while the name sat right in front of the user; a lone space
     dropped every single-word contact. */
  const raw = normSpace(q);
  /* A new query keeps the scroll position of the old one. Someone who had
     scrolled to the end of a long book and then typed a query was left looking
     at the middle of the results — the first matches, the ones the search is
     for, were scrolled out of view above — and a query that matched a handful
     of rows out of three thousand looked as though it had matched nothing at
     all. Each query starts at the top of its own results. */
  const newQuery = raw !== lastQuery;

     finds "José" instead of nothing at all */

  /* a number is stored the way the device saved it, so searching the digits a
     person would dial ("5551234") matched nothing at all */
  /* ...but only when the query is a number. Every query had its digits pulled
     out and matched against the numbers, so "office 2" and "rao 6" listed every
     contact whose number happened to contain that digit — a name search that
     returned the whole address book. Digits are a number search only when

    }

     digit every number shares) lands here instead of re-parsing 3000 rows. */

$("q").addEventListener("input", e => {

/* ---------------- placing a real call ---------------- */
/* An iPad on iPadOS 13 or later says "iPad" nowhere in its user agent: it sends
   the desktop Safari one ("Macintosh; Intel Mac OS X …") so that sites serve
   their desktop layout, and the only thing left that gives it away is that a Mac
   with a touch screen does not exist — navigator.maxTouchPoints is above 1 there
   and 0 on every real Mac. Without that test an iPad was read as a desktop, so
   tapping Call opened the simulated call screen instead of handing the number to
   the system dialer: the one device that can place a real call was the one that
   could not, silently. The install hint further down tests the same string and
   missed the iPad for the same reason, so it never offered "Add to Home Screen"
   there either. One test, both callers. */
const TOUCH_MAC = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
const MOBILE = TOUCH_MAC || /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);

/* Two digits, without String.prototype.padStart. padStart only exists from
   Chrome 57, and this app runs on a WebView the device provides: the one an
   Android 7 phone shipped with is Chrome 51, where padStart is missing and every
   caller threw — stamp() on the first dial, and tick() while the page was still
   starting up, which took the rest of that start-up with it (no contact read, no
   tab capsule, no number fitting). */
const pad2 = n => (n < 10 ? "0" : "") + n;

function stamp() {
  const d = new Date();
  return (d.getHours() % 12 || 12) + ":" + pad2(d.getMinutes());
}

/* The number and time of the last dial. A double tap on the green button — or on
   a row, or on the match chip — placed two calls: two intents handed to telecom
   and two identical rows in Recents, because nothing said the first tap was
   already being acted on. The second tap of a double tap lands long before any
   call it started could have ended. */
let lastDial = "", lastDialAt = 0;
const DIAL_REPEAT_MS = 1200;

function placeCall(number, name) {
  const raw = String(number == null ? "" : number);
  const kept = raw.replace(/[^\d+*#]/g, "");
  /* "+" is only a dialling prefix when it comes first. Holding 0 — or pressing
     shift and "=" on a keyboard — in the middle of a number put it there too, and
     the number went to telecom as "tel:555+9": not a dialable number, so the call
     failed with "Could not start the call" while a row for it still went into
     Recents. Keep the leading prefix, drop every other one. */
  const d = (kept.charAt(0) === "+" ? "+" : "") + kept.replace(/\+/g, "");
  /* a value made only of "+", "*" or "#" is not a number: holding 0 until it
     inserted "+" and then tapping Call handed "tel:+" to the system dialer and
     left a "+" row in Recents. startCall() already refused this; the path that
     dials on a real device did not. */
  if (!d || !/[0-9]/.test(d)) return;
  const now = Date.now();
  if (d === lastDial && now - lastDialAt < DIAL_REPEAT_MS) return;
  lastDial = d; lastDialAt = now;
  /* The name on the row has to describe the number that was dialled. It used to
     be built from the raw value, which still carries every "+" that was dropped
     above: typing "555", holding 0 and dialling left a Recents row that read
     "555+" over a number that dials 555, and a second "+" read "555+8+8" over
     55588. Build it from the cleaned number instead — for every number that
     needed no cleaning this is the identical string. */
  dialed.unshift({ number: d, name: name || fmt(d), when: stamp() });
  dialed = dialed.slice(0, 40);
  try { localStorage.setItem("phone.dialed", JSON.stringify(dialed)); } catch (e) {}
  renderRecents(recentsFilter());
  buzz(8);
  if (window.PhoneNative && PhoneNative.dial) {
    /* the bridge can already be gone (Activity torn down, page kept alive): an
       exception here left the tap with no effect at all and nothing to catch it */
    try {
      PhoneNative.dial(d);                      // native app: place a real call
    } catch (err) {
      window.location.href = "tel:" + d.replace(/#/g, "%23");
    }
  } else if (MOBILE) {
    /* a bare "#" starts a URI fragment, so *123# and *#06# reached the system
       dialer cut off at the "#" — the same bug the native bridge already fixed */
    window.location.href = "tel:" + d.replace(/#/g, "%23");   // browser: hand off to the system dialer
  } else {
    startCall(d, { n: name || fmt(d) });        // desktop: show the in-app call screen
  }
}

/* ---------------- call screen ---------------- */
const device = $("device"), cs = $("callscreen"), csName = $("csName"), csStatus = $("csStatus");
let callTimer = null, callStartedAt = 0;

/* elapsed time comes from the clock, so it is still right after the timer was paused */
function paintCallTime() {
  const secs = Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000));
  /* startCallTimer() paints immediately, and again on every return to the
     foreground: within the same second the string is the one already on
     screen, and assigning textContent replaces the text node and invalidates
     the line for nothing. render() guards the number line the same way. */
  const t = pad2(Math.floor(secs / 60)) + ":" + pad2(secs % 60);
  if (csStatus.textContent !== t) csStatus.textContent = t;
}
function startCallTimer() {
  clearInterval(callTimer);
  /* the status sat on "calling…" until the first one-second tick, so the timer
     only showed up 3.6 s after dialling, and came back a second stale after
     returning from the background */
  paintCallTime();
  callTimer = setInterval(paintCallTime, 1000);
}

/* The call sheet covers the dialer; covering is not hiding. Every control
   behind it — the keypad, the tab bar, the lists, the install card, the glass
   sheet — stayed in the tab order and in the accessibility tree for the length
   of the call, so a screen reader could swipe out of the call and into a
   dialer nobody can see, and the keyboard could focus the same controls.
   Mark what the sheet covers hidden while it is up (inert where the WebView
   knows it, which also takes it out of the tab order) and restore each one
   afterwards; #gsheet keeps the aria-hidden its own open()/close() sets. */
function behindCall(hidden) {
  const parts = [app, tabbar, $("install")];
  for (let i = 0; i < parts.length; i++) {
    const el = parts[i];
    if (!el) continue;
    el.setAttribute("aria-hidden", hidden ? "true" : "false");
    try { el.inert = hidden; } catch (e) { }

  if (gs) {

       ever adds to that. Setting it to `hidden` alone made a closed sheet
       focusable again the moment the call ended. */
    const gsOpen = gs.classList.contains("show");
    gs.setAttribute("aria-hidden", (hidden || !gsOpen) ? "true" : "false");

function startCall(number, person) {

  csName.textContent = person ? person.n : fmt(number);
  csStatus.textContent = "calling…";

  callStartedAt = 0;
  startCall.t = setTimeout(() => {

    callStartedAt = Date.now();

       1 Hz timer while hidden; visibilitychange restarts it on return */

  clearInterval(callTimer); clearTimeout(startCall.t);

     real request: a call placed and ended at once — a misdial — could not be
     placed again from the same row until that window ran out, with nothing on
     screen to say why. A double tap cannot span a call that has ended, so the
     guard starts over here. */
  lastDial = "";

    b.classList.remove("on");
    b.setAttribute("aria-pressed", "false");   /* the state above was cleared */

  b.setAttribute("aria-pressed", "false");

/* ---------------- clock ---------------- */
const clockEl = $("clock");
function tick() {
  const d = new Date();
  let h = d.getHours(), m = pad2(d.getMinutes());
  h = h % 12 || 12;
  /* the clock is repainted on every return to the foreground as well as once
     a minute, and most of those land inside the minute already on screen */
  const t = h + ":" + m;
  if (clockEl.textContent !== t) clockEl.textContent = t;
}
/* wake once a minute, right after the minute turns over, instead of every 15s forever */
let clockT = null;
function scheduleClock() {
  clearTimeout(clockT);
  const d = new Date();
  clockT = setTimeout(() => { tick(); scheduleClock(); },
    (60 - d.getSeconds()) * 1000 - d.getMilliseconds() + 25);
}
tick();
scheduleClock();

/* nothing on screen needs to tick while the app is in the background */
document.addEventListener("visibilitychange", () => {
  app.classList.toggle("still", document.hidden);
  if (document.hidden) {
    clearTimeout(clockT);
    clearInterval(callTimer);
    /* a finger held on a key when the app went away left its 500/600 ms timer
       running. It fired behind the hidden page and inserted a "+" into the
       number — or wiped it — with nothing on screen to show for it. */
    clearTimeout(pressT); pressT = null;
    clearTimeout(hold);
    clearTimeout(zeroHold);
    /* a finger on the tab bar when the app went away never delivers its
       pointerup, which left the capsule stuck in its grabbed state */
    dropDrag(false);
    if (numAnim) { try { numAnim.cancel(); } catch (e) {} numAnim = null; }
    return;
  }
  tick();
  scheduleClock();
  flushSearch();
  /* A resize that landed while the page was hidden armed remeasureLayout()'s
     one-frame coalescer and the frame never ran, so its guard then ignored
     every later resize for the rest of the session: the tab capsule and the
     number line kept the geometry they had when the page went away. The flag
     is dropped and the measurement taken again, now that frames run. */
  remeasure = false;
  remeasureLayout();
  if (cs.classList.contains("show") && callStartedAt) startCallTimer();
});

(function installTip() {
  const card = $("install"), btn = $("installBtn"), x = $("installX");
  if (!card) return;
  /* the "x" was only wired up on the browser path, so inside the Android app the
     card came back on every launch with a dismiss button that did nothing and no
     way to get rid of it short of making Phone the default dialer */
  let off = false;
  try { off = localStorage.getItem("phone.installTip") === "off"; } catch (e) {}

    card.classList.remove("show");

       dialog. */
    const onShow = () => {
      if (document.hidden) return;
      /* The card is gone — dismissed, or the role was granted — and nothing in
         this page can bring it back, so this check has nothing left to decide.
         It was never removed, so every return to the foreground made a binder
         call into RoleManager for the rest of the session. Drop it. */
      if (!card.classList.contains("show")) {
        document.removeEventListener("visibilitychange", onShow);
        return;
      }
      let held = false;
      try { held = !!PhoneNative.isDefaultDialer(); } catch (e) { return; }
      if (held) card.classList.remove("show");
    };
    document.addEventListener("visibilitychange", onShow);
    return;
  }
  /* a missing or throwing matchMedia must not stop the page booting: no answer
     means "not standalone", which is what the banner already assumed */
  const displayMode = mq("(display-mode: standalone)");
  const standalone = (displayMode ? displayMode.matches : false) || navigator.standalone === true;
  /* iPadOS 13+ reports a Macintosh UA — see TOUCH_MAC above */
  const ios = TOUCH_MAC || /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (standalone || off || location.protocol === "file:") return;
  let prompt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; btn.hidden = false; });
  if (ios) {
    $("installText").innerHTML = "Tap <b>Share</b> then <b>Add to Home Screen</b> to keep Phone on your home screen.";
  }
  card.classList.add("show");
  /* same reason as the Paste handler: no async function in this page */
  btn.addEventListener("click", () => {
    if (!prompt) return;
    const p = prompt;
    p.prompt();
    const done = () => card.classList.remove("show");
    try { p.userChoice.then(done, done); } catch (err) { done(); }
  });
})();

/* ---------------- liquid glass settings ---------------- */
(function glassSettings() {
  /* same rule: with no answer, fall back to the dark defaults the stylesheet
     itself falls back to, instead of throwing out of this block */
  /* The Default preset is the transparency the *current* appearance calls for,
     and the two appearances do not share one: 58% in the dark, 45% in the light.
     It was read once, when the page loaded, so after a system light/dark switch
     the Default button applied the other scheme's value and the glass came back
     at the wrong strength. Ask again when the preset is applied; the value the
     page starts with is still the one its own scheme gives it. */
  const schemeDefault = () => {
    const lightMQ = mq("(prefers-color-scheme: light)");
    const dark = !(lightMQ && lightMQ.matches);
    return { v: dark ? 58 : 45, blur: 22, sat: 200, edge: 100, glow: 100 };
  };
  const DEF = schemeDefault();
  const PRE = {
    clear: { v: 90, blur: 10, sat: 230, edge: 150, glow: 100 },
    frost: { v: 22, blur: 42, sat: 160, edge: 80, glow: 60 }
  };
  const FIELDS = [
    ["v", "Transparency", 0, 100, 1, "%"],
    ["blur", "Blur", 0, 50, 1, "px"],
    ["sat", "Saturation", 100, 300, 5, "%"],
    ["edge", "Edge highlight", 0, 200, 5, "%"],
    ["glow", "Background glow", 0, 100, 5, "%"]
  ];
  let G = Object.assign({}, DEF);
  try { Object.assign(G, JSON.parse(localStorage.getItem("phone.glass") || "{}")); } catch (e) {}
  /* the stored values were written straight into custom properties, so a
     half-written or hand-edited entry like {"v":"abc"} set --g-a:NaN and took
     the backdrop blur out entirely. Coerce to a number and clamp to the slider. */
  /* ...and only a number (or a string that holds one) is a number: Number([])
     is 0 and Number(true) is 1, so a stored {"glow":[]} or {"v":true} passed
     the isFinite() test as a real value and clamped to the bottom of the
     slider — the background glow went out and the sheet read 0% — instead of
     falling back to the default the way {"v":"abc"} already did. */
  FIELDS.forEach(([k, , lo, hi, step]) => {
    const raw = G[k];
    const numeric = typeof raw === "number" ||
      (typeof raw === "string" && raw.trim() !== "");
    const n = numeric ? Number(raw) : NaN;
    if (!isFinite(n)) { G[k] = DEF[k]; return; }
    /* ...and a number that is not on the slider's own step grid is not a value
       the slider can hold. A stored {"sat":201} — step 5 — was clamped and used
       as 201: --g-sat read 201%, the readout under it read "201%", and the range
       input snapped its own thumb to 200, so the sheet showed one value while
       the thumb sat on another and the first drag of the slider jumped to a
       third. Snap the stored value to the grid the control actually uses, so the
       property, the readout and the thumb all say the same thing. Every value
       this app writes is already on the grid, so nothing it stored changes. */
    const snapped = lo + Math.round((Math.min(hi, Math.max(lo, n)) - lo) / step) * step;
    G[k] = Math.min(hi, Math.max(lo, snapped));
  });
  const sheet = $("gsheet"), gear = $("gear"), rows = $("gsRows"), ins = {};

  /* a slider drag fires 'input' on every frame; writing localStorage on each
     one meant ~60 synchronous JSON writes a second while dragging */
  let saveT = null, slideQueued = false;
  /* The fields whose value has changed since the last paint. A frame repainted
     the one field that happened to open it, so a second slider moved inside the
     same frame — two fingers on two sliders, or a thumb and a keyboard — was
     never repainted at all: its custom property kept the old value while G, and
     therefore what is saved, held the new one, and the sheet went on reading the
     old number under it. Collect the fields and repaint every one of them. */
  const dirty = [];
  function paintDirty() {
    if (!dirty.length) return;
    for (let d = 0; d < dirty.length; d++) paint(dirty[d]);
    dirty.length = 0;
  }
  function flush() {
    clearTimeout(saveT);
    saveT = null;
    try { localStorage.setItem("phone.glass", JSON.stringify(G)); } catch (e) {}
  }
  /* the 250 ms save timer was lost when the page was closed or backgrounded
     right after a drag, so the last slider position was never written.
     A drag also coalesces its repaint into one animation frame, and a frame that
     never runs — the page hidden or closed between the last 'input' and the next
     frame — left that timer unarmed as well, so the drag was lost the same way.
     G already holds the new value the moment 'input' fires; write it now. */
  function flushIfPending() {
    const pending = slideQueued || saveT !== null;
    slideQueued = false;
    if (pending) flush();
  }
  addEventListener("pagehide", flushIfPending);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { flushIfPending(); return; }
    /* A drag whose repaint frame never ran — the page was hidden between the
       last 'input' and the next frame — left its property stale for the rest of
       the session: the value was saved, and the slider and the readout agreed on
       it, but the glass was still painted from the old one. Paint whatever is
       still owed now that frames run again; on every ordinary return the list is
       empty and this does nothing. */
    paintDirty();
  });

  /* One field's own paint: the derived custom property it feeds, and its row.
     A drag changes exactly one field, and every frame of it used to rewrite all
     five of the root properties and all five rows. A write to a custom property
     on <html> invalidates style for the whole document, so dragging the
     transparency slider re-resolved the glass blur, the tab bar, the sheet and
     the ambient layer sixty times a second for four values that had not
     changed — and it wrote the dragged slider's own .value back into the range
     input under the finger, which resets its thumb mid-gesture. */
  function paint(k) {
    const r = document.documentElement.style;
    if (k === "v") r.setProperty("--g-a", (0.8 * (1 - G.v / 100)).toFixed(3));
    else if (k === "blur") r.setProperty("--g-blur", G.blur + "px");
    else if (k === "sat") r.setProperty("--g-sat", G.sat + "%");
    else if (k === "edge") r.setProperty("--g-edge", G.edge / 100);
    else if (k === "glow") r.setProperty("--g-glow", G.glow / 100);
    const i = ins[k];
    if (!i) return;
    /* the slider being dragged already holds this value; assigning it again is
       a write for nothing, and only the track fill and the readout are stale */
    if (i.el.value !== String(G[k])) i.el.value = G[k];
    i.el.style.setProperty("--p", ((G[k] - i.lo) / (i.hi - i.lo) * 100) + "%");
    i.out.textContent = G[k] + i.u;
  }
  function saveSoon() {
    clearTimeout(saveT);
    saveT = setTimeout(flush, 250);
  }
  function apply(save) {
    for (let f = 0; f < FIELDS.length; f++) paint(FIELDS[f][0]);
    /* every field has just been painted from G, so nothing is owed a repaint */
    dirty.length = 0;
    if (save) saveSoon();
  }
  FIELDS.forEach(([k, name, lo, hi, step, u]) => {
    const row = document.createElement("div");
    row.className = "gs-row";
    row.innerHTML = `<label for="gs-${k}">${name}</label><output></output><input id="gs-${k}" type="range" min="${lo}" max="${hi}" step="${step}">`;
    rows.appendChild(row);
    const el = row.querySelector("input"), out = row.querySelector("output");
    ins[k] = { el, lo: lo, hi: hi, u: u, out: out };
    /* a drag fires 'input' more than once per frame and every one of them
       repainted the glass; coalesce to one repaint per frame, as the contacts
       search box already does — and repaint only the field that moved */
    el.addEventListener("input", () => {
      G[k] = +el.value;
      if (dirty.indexOf(k) < 0) dirty.push(k);
      if (slideQueued) return;
      slideQueued = true;
      requestAnimationFrame(() => { slideQueued = false; paintDirty(); saveSoon(); });
    });
  });
  document.querySelectorAll(".gs-pre button").forEach(b =>
    b.addEventListener("click", () => {
      G = Object.assign({}, b.dataset.p === "def" ? schemeDefault() : (PRE[b.dataset.p] || DEF));
      apply(true);
    }));

  function open(on) {
    const was = sheet.classList.contains("show");
    if (!on && was) flush();          /* closing commits the last slider value now */
    sheet.classList.toggle("show", on);
    gear.classList.toggle("on", on);
    sheet.setAttribute("aria-hidden", String(!on));
    /* aria-hidden says nothing to the tab order: while the sheet is fading out
       (or already invisible) its five sliders and its Done button are still
       focusable, so Tab and a screen reader could walk into a panel nobody can
       see. inert takes the closed sheet out of both, on the engines that have
       it; the stylesheet's pointer-events covers the rest. */
    try { sheet.inert = !on; } catch (e) { }
    if (on !== was) buzz(6);
  }
  /* the sheet starts closed, and open() is only ever reached from a tap: mark
     it inert now so the state holds from the first frame */
  try { sheet.inert = true; } catch (e) { }
  gear.addEventListener("click", () => open(!sheet.classList.contains("show")));
  $("gsDone").addEventListener("click", () => open(false));
  document.addEventListener("pointerdown", e => {
    if (sheet.classList.contains("show") && !e.target.closest("#gsheet") && !e.target.closest("#gear") && !e.target.closest("#tabbar")) open(false);
  }, true);
  /* Escape used to call open(false) unconditionally, so every Escape press
     buzzed the phone even with the sheet already closed */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && sheet.classList.contains("show")) open(false);
  });
  apply(false);
})();

/* ---------------- boot ---------------- */
snap();
render();
/* a page can be created already hidden (restored in the background) */
app.classList.toggle("still", document.hidden);

/* real contacts and call history, when running inside the Android app.
   logOnly re-reads the call log on its own: that is the cheap half of this —
   one provider query and forty rows — and it is the half that goes stale while
   the app is open, because contacts only change when the user changes them. */
function hydrateNative(logOnly) {
  if (!window.PhoneNative) return;
  /* both lists are replaced even when they come back empty. Keeping the old
     ones whenever the new read was empty meant that revoking contacts access —
     or deleting every contact — left the previous list on screen, and a row
     from it still dialled a number the app could no longer read. A failed
     parse still leaves the current data alone. */
  /* An answer that is not a string at all — the bridge method returned null, or
     it has gone away between the call and its return — was folded into "[]" by
     the `||` that used to sit here, so a read that produced nothing at all was
     indistinguishable from a device with no contacts: both lists were replaced
     with their empty states, and every row that had been on screen stopped
     being dialable. A missing answer is a failed read, exactly like the "null"
     string the bridge sends for a provider that threw; only an answer that
     parses to a real array replaces what is on screen. */
  const read = raw => (raw == null ? null : JSON.parse(raw));
  let list = null, log = null;
  if (!logOnly) {
    try { list = read(PhoneNative.contacts()); } catch (e) {}
  }
  try { log = read(PhoneNative.callLog()); } catch (e) {}
  const freshPeople = Array.isArray(list), freshLog = Array.isArray(log);
  /* "null" from either read means the provider threw, not that the device has
     nothing. Both lists then keep what they had — and there is nothing on screen
     to redraw either, yet the contact index was re-sorted, the favourites
     rebuilt and the whole Recents list re-rendered (and its cached markup
     thrown away) for a read that changed nothing at all. */
  if (!freshPeople && !freshLog) return;
  if (freshPeople) {
    people.length = 0;
    /* Every cache on the contact path is a WeakMap keyed by the contact object,
       and a primitive is not a legal key: initialsOf() already refuses one, but
       t9Of()/telOf() would throw on it — and that throw came out of render(),
       so one malformed row stopped the number line updating for the rest of the
       session. Only objects can be contacts. */
    /* ...and only a contact that carries a number can be drawn. The Java side
       already skips a Phone row with no number, and recRowMarkup() refuses a
       person that is not an object for the call log, but this list took whatever
       object it was handed: a contact with a blank or missing number became a
       row with an empty name, an empty subtitle and data-tel="", filed under a
       "#" heading — a row that does nothing at all when it is tapped. Keep the
       same rule the bridge keeps. */
    /* ...and only a contact that can be told apart can be drawn. A name that
       came back blank or missing drew a row with no title at all — a "#"
       avatar, an empty line above the number, filed under "#" — and its search
       key was empty, so no query could ever find it: the row existed, dialled,
       and could not be identified or searched for. The bridge already answers a
       blank name with the number (Bridge.contacts() does exactly this); apply
       the same rule to whatever the page is handed, before the index is built
       from it. */
    list.forEach(p => {
      if (!p || typeof p !== "object") return;
      const tel = p.t == null ? "" : String(p.t);
      /* trim() is not the test the rest of this page uses for "blank". A name
         that holds nothing but characters with no shape — a zero-width space, a
         right-to-left mark, a byte order mark, a soft hyphen, one of the
         isolates a vCard pins a name with — survives trim() untouched, because
         none of them is whitespace. So the fallback above never fired for them:
         the row was drawn with an invisible title over a real number, filed
         under "#", and its search key was empty, so no query could ever find
         it — the same defect the whitespace-only case was fixed for, on the
         characters the address book actually gets its names from. normSpace()
         is the helper that already strips exactly this set; ask it. */
      if (!normSpace(tel)) return;
      if (p.n == null || !normSpace(p.n)) p.n = tel.trim();
      people.push(p);
    });
  }
  if (freshLog) {
    recents.length = 0;
    log.forEach(r => { if (r) recents.push(r); });
    /* The local dialled list only covers calls made since the last read, but it
       was never dropped once the device log knew about them too: Recents drew
       both rows, so every call placed from inside the app appeared twice — and
       stayed doubled across launches. The log is the authority (it evicts by
       recency, so a local call whose number is in the log is in the log), so
       the local copy goes. */
    if (recents.length) {
      const logged = new Set();
      /* the log keeps a number the way the contact saved it, so the exact string
         alone is not enough to decide "the log already has this call" — see
         sameAsLogged() below */
      const loggedDig = [];
      recents.forEach(r => {
        const t = r && r.p ? String(r.p.t == null ? "" : r.p.t).replace(/\D/g, "") : "";
        if (t) { logged.add(t); loggedDig.push(t); }
      });
      if (logged.size) {
        const before = dialed.length;
        /* The device log stores "+91 98765 43210" for a number this page writes
           down as the digits that were actually typed, "9876543210". An exact
           string compare said those were two different calls, so the row for the
           call that had just been placed was never dropped: it sat in Recents
           next to the log's own row for the same call, and stayed there across
           launches. Compare the tail, exactly as the keypad's contact match
           already does — the shorter number is the same call when it is a suffix
           of the longer one, and long enough that the match means something. */
        const sameAsLogged = n => {
          if (!n) return false;
          if (logged.has(n)) return true;
          if (n.length < 7) return false;
          for (let i = 0; i < loggedDig.length; i++) {
            const t = loggedDig[i];
            if (t.length >= 7 && (t.endsWith(n) || n.endsWith(t))) return true;
          }
          return false;
        };
        dialed = dialed.filter(d => !sameAsLogged(String(d.number).replace(/\D/g, "")));
        /* only the in-memory list was trimmed, so storage kept every row the log
           already knew about. They came back — with their old times, at the top —
           as soon as the log rolled past them. Write the trimmed list back. */
        if (dialed.length !== before) {
          try { localStorage.setItem("phone.dialed", JSON.stringify(dialed)); } catch (e) {}
        }
      }
    }
  }
  /* the index, the tiles and the Contacts markup are built from people alone, so
     a log-only refresh leaves them exactly as they were */
  if (freshPeople) {
    buildContactIdx();
    renderFavs();
  }
  /* re-reading the call log used to drop the Recents list back to All while the
     Missed pill stayed selected, so the filtered list showed outgoing calls */
  renderRecents(recentsFilter());
  /* Building the Contacts list is the most expensive thing on the page — a few
     thousand rows is over a hundred milliseconds of HTML parsing, and it blocks
     the first paint after every hydrate (app resume, a permission change). It
     was rebuilt even while the Contacts tab was off screen, and buildContactIdx()
     has already marked it stale, so it is now built when the tab is opened —
     or straight away if that tab is the one on screen. */
  /* ...but only when the contacts themselves changed. A log-only refresh leaves
     the index, and therefore the markup, exactly as it was (buildContactIdx()
     is the only thing that marks it stale), and this ran on every return to the
     foreground: with the Contacts tab open, each resume rebuilt all three
     thousand rows into a string and then threw it away because it matched the
     cached one — about 33 ms of main-thread work per resume, measured. */
  if (freshPeople && app.dataset.view === "contacts") renderContacts($("q").value || "");
  /* the keypad was never repainted after a data load. A number typed while the
     contacts were still being read — or before the permission result arrived —
     therefore showed no contact match under it, and kept the font size it had
     been given while the list was empty, until the next keystroke. */
  render();
}
/* the contact read, the JSON parse and a full re-render of every list used to
   run inside the page's first script pass, so nothing painted until all of it
   was parsed, rendered and laid out. Paint the keypad first, fill in on the
   next task. */
setTimeout(hydrateNative, 0);
/* the permission dialog result re-runs this instead of reloading the whole page,
   which used to replay the entrance animations and throw away a typed number */
window.__phoneHydrate = hydrateNative;
/* Called on every return to the foreground: the call log is the list that goes
   stale there. A call that came in while the app was open — or one placed from
   another app — used to be missing from Recents until the process was killed
   and reopened, which is the one thing a dialer must not lose. */
window.__phoneLog = function () { hydrateNative(true); };
/* A tel: link handed to the app from anywhere else in the system. The manifest
   has always advertised ACTION_DIAL, but the activity behind it finished without
   ever reading the intent, so tapping a phone number in a message, a browser or
   a contact card did nothing at all. The number now lands on the keypad exactly
   as if it had been typed, ready for the call button. */
window.__phoneNumber = function (n) {
  /* "tel:123;ext=6" — the part after the semicolon is not the number, and its
     digits would otherwise end up on the end of it */
  const clean = String(n == null ? "" : n).split(";")[0].replace(/[^\d+*#]/g, "").slice(0, 20);
  if (!clean) return;
  value = clean;
  /* the number is only useful on the keypad, so that is the page it opens on */
  if (app.dataset.view !== "keypad") go(3);
  render();
};

/* one re-measure per frame; also keeps the All/Missed capsule on the selected side
   instead of snapping it back to All when the fonts finish loading */
let remeasure = false;
function remeasureLayout() {
  if (remeasure) return;
  remeasure = true;
  tabMids = null;   /* the tab centres are about to move: drop the cached ones */
  numMaxW = 0;      /* and so is the width the number line fits into */
  fitText = null;   /* the font may have changed with it: fit the line again */
  requestAnimationFrame(() => { remeasure = false; snap(); fitNumber(); syncSeg(); });
}
addEventListener("resize", remeasureLayout);
/* fonts.ready is a promise from an optional API: a WebView that answers it with
   an exception used to take the last statement of this script with it, and the
   All/Missed capsule stayed unpositioned until Recents was opened by hand. */
/* ...and try/catch only ever saw a *synchronous* throw. fonts.ready is a
   promise, and a rejected one is not an exception here: nothing handled it, so
   remeasureLayout() never ran and the same thing happened — the All/Missed
   capsule sat at 0px and the number line kept the size it had before the font
   swap — with an unhandled rejection in the log instead. The install prompt's
   userChoice already takes its handler twice for this reason; do the same. */
try {
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(remeasureLayout, remeasureLayout);
  }
} catch (e) { }
syncSeg();
</script>
</body>
</html>

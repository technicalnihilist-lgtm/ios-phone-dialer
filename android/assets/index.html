<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Phone">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Phone</title>
<style>
:root{
  --bg:#000;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --fill:rgba(120,120,128,.32);--fill-press:rgba(120,120,128,.52);
  --sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--red:#ff453a;
  --card:#1c1c1e;--glassbg:rgba(44,44,48,.62);--glassline:rgba(255,255,255,.12);
  --tabsel:rgba(255,255,255,.16);
  --safe-b:env(safe-area-inset-bottom,0px);
  --k:clamp(62px,19.1vw,75px);
  --gap:clamp(16px,6.6vw,26px);
  --vgap:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
    --fill:rgba(120,120,128,.19);--fill-press:rgba(120,120,128,.32);
    --sep:rgba(60,60,67,.25);--blue:#007aff;--green:#34c759;--red:#ff3b30;
    --card:#f2f2f7;--glassbg:rgba(248,248,250,.72);--glassline:rgba(0,0,0,.07);
    --tabsel:rgba(255,255,255,.75);
    color-scheme:light;
  }
}
@media (max-height:700px){:root{--k:60px;--vgap:10px;--gap:20px}}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  background:#000;color:var(--label);overflow:hidden;display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit}

/* ---------- device ---------- */
.device{
  position:relative;width:100vw;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
.island{display:none}
@media (min-width:520px){
  body{background:radial-gradient(120% 90% at 50% 0%,#1b1b21 0%,#0a0a0c 55%,#000 100%)}
  .device{
    width:393px;height:852px;border-radius:56px;padding-top:0;
    box-shadow:0 0 0 11px #0b0b0c,0 0 0 12.5px #3a3a3d,0 0 0 13.5px #101012,0 46px 90px rgba(0,0,0,.72);
  }
  .island{
    display:block;position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:122px;height:35px;border-radius:19px;background:#000;z-index:70;
  }
}

/* ---------- status bar ---------- */
.statusbar{
  flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 32px;font-size:16px;font-weight:600;letter-spacing:.1px;
  color:var(--label);position:relative;z-index:40;
}
@media (max-height:700px){.statusbar{height:44px}}
.statusbar .time{font-variant-numeric:tabular-nums;min-width:54px}
.device.calling .statusbar{color:#fff}
.empty{
  padding:56px 24px;text-align:center;color:var(--label2);
  font-size:17px;line-height:1.4;
}

/* ---------- app ---------- */
.app{flex:1;position:relative;min-height:0;z-index:10}
.view{
  position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none}
.app[data-view=keypad]    #v-keypad{display:flex}
.app[data-view=favorites] #v-favorites{display:block}
.app[data-view=recents]   #v-recents{display:block}
.app[data-view=contacts]  #v-contacts{display:block}
.app[data-view=voicemail] #v-voicemail{display:block}

/* ---------- keypad ---------- */
#v-keypad{
  flex-direction:column;align-items:center;overflow:hidden;
  padding:0 24px calc(96px + var(--safe-b));
}
.dialtop{
  width:100%;flex:none;padding-top:14px;min-height:104px;
  text-align:center;position:relative;
}
.number{
  display:block;width:100%;height:50px;line-height:50px;
  font-size:40px;font-weight:400;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;color:var(--label);font-variant-numeric:tabular-nums;
  transition:font-size .08s linear;
}
.addnum{
  display:none;margin:2px auto 0;padding:5px 12px;border:0;background:none;
  font-size:17px;color:var(--blue);cursor:pointer;border-radius:8px;
}
.addnum.show{display:inline-block}
.addnum:active{opacity:.5}
.match{
  display:none;align-items:center;justify-content:center;gap:9px;margin:6px auto 0;
  background:none;border:0;padding:4px 10px;cursor:pointer;border-radius:12px;
  width:max-content;max-width:100%;
}
.match.show{display:flex}
.match .av{width:30px;height:30px;font-size:12px}
.match span.mn{font-size:17px;color:var(--label)}
.match:active{opacity:.55}

.pad{
  display:grid;grid-template-columns:repeat(3,var(--k));gap:var(--vgap) var(--gap);
  margin-top:auto;
}
.key{
  width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:var(--fill);color:var(--label);cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  padding:0;transition:background .13s ease,transform .13s cubic-bezier(.3,1.5,.5,1);
}
.key b{
  font-size:calc(var(--k)*.47);font-weight:400;line-height:1;letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.key small{
  font-size:10px;font-weight:600;letter-spacing:1.7px;line-height:12px;height:12px;
  margin-top:2px;color:var(--label2);text-transform:uppercase;
}
.key.sym b{font-size:calc(var(--k)*.58);padding-top:5px}
.key.sym small{visibility:hidden}
.key:active,.key.press{background:var(--fill-press);transform:scale(1.055)}
.key:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.callrow{
  flex:none;display:grid;grid-template-columns:repeat(3,var(--k));
  gap:0 var(--gap);justify-items:center;margin-top:calc(var(--vgap) + 8px);
  padding-bottom:4px;
}
.call{
  grid-column:2;width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:var(--green);display:grid;place-items:center;cursor:pointer;
  transition:filter .13s,transform .13s cubic-bezier(.3,1.5,.5,1);
}
.call svg{width:calc(var(--k)*.42);height:calc(var(--k)*.42);fill:#fff}
.call:active{filter:brightness(1.18);transform:scale(1.05)}
.del{
  grid-column:3;width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:none;display:grid;place-items:center;color:var(--label);cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.del.show{opacity:1;pointer-events:auto}
.del:active{opacity:.45}
.del svg{
  width:calc(var(--k)*.44);height:calc(var(--k)*.44);fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- shared list bits ---------- */
.hdr{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:6px 16px 8px 20px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--bg) 72%,transparent);
}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:0;line-height:1.15}
.hdr button{
  border:0;background:none;color:var(--blue);font-size:17px;padding:4px 0 6px;cursor:pointer;
}
.hdr button:active{opacity:.5}
.av{
  width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
  background:linear-gradient(160deg,var(--a),var(--b));
}
.seg{
  display:flex;gap:0;margin:2px 16px 10px;padding:2px;border-radius:9px;
  background:var(--fill);position:relative;
}
.seg button{
  flex:1;border:0;background:none;font-size:13px;font-weight:600;color:var(--label);
  padding:6px 0;border-radius:7px;cursor:pointer;position:relative;z-index:1;
  transition:color .2s;
}
.seg button:not(.on){color:var(--label2)}
.seg .segpill{
  position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--card);
  box-shadow:0 3px 8px rgba(0,0,0,.18);transition:left .28s cubic-bezier(.3,1.2,.4,1),width .28s cubic-bezier(.3,1.2,.4,1);
}
@media (prefers-color-scheme:light){.seg .segpill{background:#fff}}

.list{background:var(--card);margin:0 16px;border-radius:14px;overflow:hidden}
.list.plain{background:none;margin:0}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;
  background:none;border:0;text-align:left;cursor:pointer;min-height:53px;position:relative;
}
.row:active{background:var(--fill)}
.row+.row::before{
  content:"";position:absolute;left:66px;right:0;top:0;height:.5px;background:var(--sep);
}
.row .av{width:40px;height:40px}
.row .t{flex:1;min-width:0;line-height:1.25}
.row .t b{display:block;font-size:17px;font-weight:400;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.missed .t b{color:var(--red)}
.row time{font-size:15px;color:var(--label2);flex:none;margin-left:6px}
.row .info{
  width:26px;height:26px;border-radius:50%;border:0;background:none;flex:none;
  display:grid;place-items:center;color:var(--blue);cursor:pointer;
}
.row .info svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}

.sec{
  font-size:13px;font-weight:600;color:var(--label2);padding:11px 16px 3px 20px;
  letter-spacing:.4px;background:var(--bg);
}

/* favorites */
.favs{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:2px 16px 8px}
.fav{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 13px;
  border:0;border-radius:18px;background:var(--card);cursor:pointer;text-align:center;
}
.fav:active{background:var(--fill)}
.fav .av{width:54px;height:54px;font-size:20px;margin-bottom:7px}
.fav b{font-size:16px;font-weight:500;color:var(--label)}
.fav small{font-size:12px;color:var(--label2)}

/* contacts search */
.searchwrap{padding:0 16px 12px}
.search{
  display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;
  padding:7px 9px;color:var(--label2);
}
.search svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.search input{
  border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);
  width:100%;padding:0;-webkit-appearance:none;
}
.search input::placeholder{color:var(--label2)}

/* voicemail */
.vm .play{
  width:34px;height:34px;border-radius:50%;border:0;background:none;flex:none;
  display:grid;place-items:center;color:var(--blue);cursor:pointer;
}
.vm .play svg{width:22px;height:22px;fill:currentColor}
.vm .t b{font-weight:600}
.vm .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute;left:9px;right:9px;bottom:calc(8px + var(--safe-b));height:60px;
  display:flex;align-items:center;border-radius:30px;z-index:30;
  background:var(--glassbg);border:.5px solid var(--glassline);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 8px 26px rgba(0,0,0,.28);
  touch-action:none;overflow:hidden;
}
.tabbar .pill{
  position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:25px;z-index:0;
  pointer-events:none;background:var(--tabsel);
  box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.28);
  transition:left .42s cubic-bezier(.32,1.4,.42,1),width .42s cubic-bezier(.32,1.4,.42,1),transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;
}
.tabbar .pill.noanim{transition:none!important}
.tabbar .pill.grab{transform:scale(1.06);opacity:.9}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:0;border:0;background:none;cursor:pointer;position:relative;z-index:1;
  color:var(--label2);transition:color .2s;height:100%;
}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500;letter-spacing:.1px}
.tab.on{color:var(--label)}

/* ---------- call screen ---------- */
.callscreen{
  position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;
  padding:70px 26px calc(34px + var(--safe-b));
  transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.9,.24,1);
  background:
    radial-gradient(90% 60% at 50% 0%,#3a3a44 0%,transparent 70%),
    linear-gradient(#101014,#050506);
  color:#fff;
}
.callscreen.show{transform:none}
.cs-top{text-align:center;flex:none;padding-top:26px}
.cs-name{font-size:34px;font-weight:400;letter-spacing:-.3px;margin-bottom:6px}
.cs-status{font-size:17px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.cs-actions{
  margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px 8px;justify-items:center;padding-bottom:34px;
}
.cs-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:0;background:none;color:#fff;cursor:pointer;font-size:11px;
}
.cs-btn i{
  width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:background .15s,transform .15s;
}
.cs-btn:active i{background:rgba(255,255,255,.3);transform:scale(.96)}
.cs-btn.on i{background:#fff}
.cs-btn.on i svg{stroke:#000;fill:#000}
.cs-btn svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cs-end{
  align-self:center;width:70px;height:70px;border-radius:50%;border:0;background:#ff453a;
  display:grid;place-items:center;cursor:pointer;flex:none;
}
.cs-end svg{width:32px;height:32px;fill:#fff;transform:rotate(135deg)}
.cs-end:active{filter:brightness(1.15)}

/* install card */
.install{
  position:absolute;left:10px;right:10px;bottom:calc(78px + var(--safe-b));z-index:34;
  display:none;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;
  background:var(--glassbg);border:.5px solid var(--glassline);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:13px;line-height:1.3;color:var(--label);
}
.install.show{display:flex}
.install span{flex:1}
.install b{font-weight:600}
.install button{
  border:0;background:none;color:var(--blue);font-size:14px;font-weight:600;
  padding:4px 6px;cursor:pointer;flex:none;
}
.install #installX{color:var(--label2);font-size:20px;line-height:1;padding:0 2px}

/* paste menu */
.menu{
  position:absolute;z-index:90;display:none;transform-origin:50% 0;
  background:var(--glassbg);border:.5px solid var(--glassline);border-radius:13px;
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden;min-width:190px;
  animation:menuIn .18s cubic-bezier(.3,1.4,.5,1) both;
}
.menu.show{display:block}
.menu button{
  display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;
  font-size:16px;color:var(--label);cursor:pointer;
}
.menu button:active{background:var(--fill)}

@keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.app.goR .view,.app.goL .view{animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
.app.goR .view{animation-name:inR}
.app.goL .view{animation-name:inL}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ===== spring physics + liquid glass layer ===== */
:root{
  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring-soft:cubic-bezier(.22,1.2,.36,1);
  --spring-sheet:cubic-bezier(.22,1,.36,1);
  --glassbg:rgba(70,70,78,.34);
  --glassedge:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.07);
}
@media (prefers-color-scheme:light){:root{
  --glassbg:rgba(255,255,255,.44);
  --glassedge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.35);
}}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,0.024,0.089,0.18,0.287,0.402,0.516,0.626,0.726,0.815,0.891,0.953,1.003,1.04,1.067,1.083,1.092,1.095,1.092,1.086,1.077,1.067,1.056,1.045,1.035,1.025,1.017,1.01,1.004,0.999,0.996,0.994,0.992,0.991,0.991,0.991,0.992,0.993,0.994,0.995,0.996,0.997,0.998,0.998,0.999,1,1);--spring-soft:linear(0,0.016,0.057,0.117,0.188,0.267,0.348,0.429,0.508,0.582,0.651,0.713,0.769,0.818,0.861,0.897,0.928,0.954,0.974,0.991,1.003,1.013,1.02,1.024,1.027,1.028,1.028,1.028,1.026,1.024,1.022,1.02,1.018,1.015,1.013,1.011,1.009,1.007,1.006,1.005,1.004,1.003,1.002,1.001,1.001,1,1);--spring-sheet:linear(0,0.014,0.05,0.103,0.166,0.236,0.309,0.383,0.455,0.524,0.588,0.648,0.703,0.752,0.795,0.834,0.867,0.896,0.921,0.942,0.959,0.973,0.984,0.993,1,1.006,1.01,1.012,1.014,1.015,1.015,1.015,1.014,1.014,1.013,1.012,1.011,1.009,1.008,1.007,1.006,1.005,1.005,1.004,1.003,1.003,1)}
}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(130%) scale(.92)}to{opacity:1;transform:none}}
@keyframes iconPop{from{transform:scale(.65) translateY(3px)}to{transform:none}}
@keyframes tap{from{transform:scale(.82)}to{transform:none}}
@keyframes menuIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes vIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*46px)) scale(.93)}to{opacity:1;transform:none}}
@keyframes vOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(calc(var(--dir,1)*-38px)) scale(.93)}}
@keyframes drift{from{transform:translate3d(-4%,0,0) scale(1)}to{transform:translate3d(4%,-6%,0) scale(1.12)}}

/* ambient colour behind the glass so the blur has something to refract */
.app::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-10%;height:58%;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 50% at 24% 62%,rgba(10,132,255,.38),transparent 70%),radial-gradient(36% 46% at 76% 72%,rgba(191,90,242,.32),transparent 70%);
  filter:blur(12px);animation:drift 14s ease-in-out infinite alternate}
/* the drift loop is endless by design, but while the page is hidden it kept a
   blurred layer — and every backdrop-filter sitting above it — repainting for
   nobody, on battery. Paused there; resumed exactly as it was on return. */
.app.still::before{animation-play-state:paused}
@media (prefers-color-scheme:light){.app::before{opacity:.55}}
.app{transition:transform .8s var(--spring-soft),filter .5s ease}
.device.calling .app{transform:scale(.92);filter:brightness(.55)}
.view:not(#v-keypad){padding-bottom:calc(96px + var(--safe-b))}

/* page transitions: old page leaves, new page springs in */
.app.goR{--dir:1}.app.goL{--dir:-1}
.app.goR .view,.app.goL .view{animation:vIn .8s var(--spring-soft) backwards}
.app.goR .view.leaving,.app.goL .view.leaving{display:block;pointer-events:none;z-index:0;animation:vOut .28s ease both}
#v-keypad.leaving{display:flex}
.app.goR .row,.app.goL .row{animation:rowIn .8s var(--spring-soft) backwards}
.app.goR #v-keypad .key,.app.goL #v-keypad .key{animation:pop .85s var(--spring) backwards;animation-delay:calc(var(--n,0)*24ms)}
.app.goR .fav,.app.goL .fav{animation:pop .85s var(--spring) backwards}
.fav:nth-child(2){animation-delay:.04s!important}.fav:nth-child(3){animation-delay:.08s!important}.fav:nth-child(4){animation-delay:.12s!important}

/* press = squash, release = spring back */
.key{transition:background .4s ease,transform .75s var(--spring)}
.key:active,.key.press{transform:scale(.9);transition:background 0s,transform .12s ease-out}
.call{transition:filter .3s,transform .75s var(--spring)}
.call:active{transform:scale(.88);transition:filter 0s,transform .12s ease-out}
.fav,.cs-end,.hdr button,.addnum,.match{transition:transform .75s var(--spring),background .3s,opacity .3s}
.fav:active,.cs-end:active,.hdr button:active,.addnum:active,.match:active{transform:scale(.92);transition:transform .12s ease-out}
.del{transform:scale(.4);transition:opacity .25s ease,transform .75s var(--spring)}
.del.show{transform:none}
.row{transition:background .35s ease}
.row:active{transition:background 0s}
.match.show,.addnum.show{animation:pop .65s var(--spring) backwards}
.tab.on svg{animation:iconPop .8s var(--spring) backwards}
.cs-btn i{transition:background .3s,transform .75s var(--spring)}
.cs-btn:active i{transform:scale(.88);transition:background 0s,transform .12s ease-out}
.cs-btn.on i{animation:tap .7s var(--spring)}
.seg .segpill{transition:left .65s var(--spring),width .65s var(--spring)}
.seg .segpill.noanim{transition:none!important}

/* liquid glass */
.tabbar{
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02)),var(--glassbg);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.08);backdrop-filter:blur(22px) saturate(200%) brightness(1.08);
  box-shadow:var(--glassedge),0 12px 32px rgba(0,0,0,.32);
  animation:rise .95s var(--spring-soft) backwards;
}
.tabbar .pill{
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));
  box-shadow:var(--glassedge),0 2px 8px rgba(0,0,0,.18);
  transition:left .75s var(--spring),width .75s var(--spring),transform .6s var(--spring),opacity .2s;
}
.tabbar .pill.grab{transform:scale(1.12);opacity:1}
.menu,.install{box-shadow:var(--glassedge),0 12px 34px rgba(0,0,0,.35)}
.menu{animation:menuIn .6s var(--spring) both}
.install.show{animation:rise .9s var(--spring-soft) backwards}
.cs-btn i{box-shadow:var(--glassedge)}

/* call screen: spring sheet (extended below the edge so overshoot never shows a gap) */
.callscreen{
  inset:0 0 -90px 0;padding-bottom:calc(124px + var(--safe-b));
  transform:translateY(105%) scale(.96);visibility:hidden;
  transition:transform .8s var(--spring-sheet),visibility 0s .8s;
}
.callscreen.show{transform:none;visibility:visible;transition:transform .8s var(--spring-sheet),visibility 0s}
.callscreen.show .cs-btn{animation:pop .85s var(--spring) backwards}
.callscreen.show .cs-end{animation:pop .9s var(--spring) .55s backwards}
.callscreen.show .cs-top{animation:rowIn .9s var(--spring-soft) .1s backwards}
.callscreen.show .cs-btn:nth-child(1){animation-delay:0.13s}.callscreen.show .cs-btn:nth-child(2){animation-delay:0.18s}.callscreen.show .cs-btn:nth-child(3){animation-delay:0.23s}.callscreen.show .cs-btn:nth-child(4){animation-delay:0.28s}.callscreen.show .cs-btn:nth-child(5){animation-delay:0.33s}.callscreen.show .cs-btn:nth-child(6){animation-delay:0.38s}

/* ===== glass settings ===== */
:root{
  --g-rgb:70,70,78;--g-a:.34;--g-blur:22px;--g-sat:200%;--g-edge:1;--g-glow:1;
  --glassbg:rgba(var(--g-rgb),var(--g-a));
  --glassedge:inset 0 1px 0 rgba(255,255,255,calc(.4*var(--g-edge))),inset 0 -1px 0 rgba(255,255,255,calc(.07*var(--g-edge))),inset 1px 0 0 rgba(255,255,255,calc(.14*var(--g-edge))),inset -1px 0 0 rgba(255,255,255,calc(.14*var(--g-edge))),inset 0 0 22px rgba(255,255,255,calc(.07*var(--g-edge)));
  --sheetbg:rgba(38,38,44,.74);
}
@media (prefers-color-scheme:light){:root{
  --g-rgb:255,255,255;
  --glassedge:inset 0 1px 0 rgba(255,255,255,calc(.95*var(--g-edge))),inset 0 -1px 0 rgba(255,255,255,calc(.4*var(--g-edge))),inset 0 0 22px rgba(255,255,255,calc(.35*var(--g-edge)));
  --sheetbg:rgba(250,250,252,.8);
}}
.tabbar,.menu,.install{
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(1.08);
  backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(1.08);
}
.app::before{opacity:var(--g-glow)}
@media (prefers-color-scheme:light){.app::before{opacity:calc(var(--g-glow)*.55)}}

#v-keypad .keypad-tools{width:100%;flex:none;display:flex;justify-content:flex-end;padding:0 2px 12px;margin-top:auto}
#v-keypad .pad{margin-top:0}

.gs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.gs-row{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0 0}

  box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,0,0,.1);transition:transform .7s var(--spring);

<script>
"use strict";

/* ---------------- data ---------------- */
/* no sample contacts — the Android build fills this from the device */
const people = [];

const recents = [];

const voicemails = [];

const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV_FALLBACK = ["#8e8e93", "#636366"];
const initials = n => String(n == null ? "" : n).trim().split(/\s+/).filter(Boolean)
  .map(w => w[0]).join("").slice(0, 2) || "#";
const avColors = c => (Array.isArray(c) && c.length > 1) ? c : AV_FALLBACK;
const avHTML = p => {
  const c = avColors(p && p.c);
  return `<span class="av" style="--a:${esc(c[0])};--b:${esc(c[1])}">${esc(initials(p && p.n))}</span>`;
};

/* ---------------- keypad ---------------- */
const KEYS = [["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],
              ["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];

const $ = id => document.getElementById(id);
const app = $("app"), num = $("num"), pad = $("pad"), del = $("del"),
      hint = $("addnum"), matchEl = $("match"), matchAv = $("matchAv"),
      matchName = $("matchName"), dialtop = $("dialtop");
let value = "";

/* call history, restored from storage before anything renders */
let dialed = [];
try {
  const stored = JSON.parse(localStorage.getItem("phone.dialed") || "[]");
  if (Array.isArray(stored)) {
    dialed = stored
      .filter(d => d && typeof d === "object" && typeof d.number === "string" && d.number)
      .map(d => ({
        number: d.number,
        name: typeof d.name === "string" && d.name ? d.name : d.number,
        when: typeof d.when === "string" ? d.when : ""
      }))
      /* the write path keeps 40 rows but the read path took whatever it found,
         so one oversized or hand-edited value rebuilt thousands of rows */
      .slice(0, 40);
  }
} catch (e) { dialed = []; }

/* the "0" key's long-press timer, kept where the visibility handler can reach it */
let zeroHold = null;

KEYS.forEach(([d, l], n) => {
  const b = document.createElement("button");
  b.className = "key" + (/[*#]/.test(d) ? " sym" : "");
  b.dataset.d = d; b.style.setProperty("--n", n);
  b.setAttribute("aria-label", d);
  b.innerHTML = `<b>${d}</b><small>${l}</small>`;
  /* a long press consumes the tap that follows it. The flag is cleared on the
     next press, not on a clock: holding the key for longer than the old expiry
     window let the release click through, so a slow long press on "0" dialled
     "+0". Clearing on pointerdown still covers a press that slid off the key
     without ever producing a click. */
  b.addEventListener("click", () => {
    if (b._lpt) { b._lpt = 0; return; }
    add(d);
  });
  if (d === "0") {
    b.addEventListener("pointerdown", () => {
      /* a second finger on the same key replaced the handle, so the first timer
         could no longer be cancelled and still fired its own "+" */
      clearTimeout(zeroHold);
      b._lpt = 0; zeroHold = setTimeout(() => { b._lpt = 1; add("+"); }, 500);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(e =>
      b.addEventListener(e, () => clearTimeout(zeroHold)));
  }
  pad.appendChild(b);
});

function fmt(v) {
  const d = v.replace(/\D/g, "");
  /* only a leading "+" used to survive: one typed on a keyboard, or inserted by
     holding 0 after a digit, was dropped from the display, so "555+" showed as
     "555" and "555+8+8" as "(555) 88" — the number on screen was not the number
     that got dialled. Any "+" now leaves the value unformatted, like * and #. */
  if (/[*#+]/.test(v) || d.length > 11) return v;
  if (d.length > 6) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length > 3) return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return d;
}

/* A name saved with an accent — "Zoë", "José", "Ünal" — could not be found at
   all. Its accented letter matched no key, so the T9 digits came out short and
   never lined up with what was typed, and the lower-cased name still carried the
   accent so it never equalled the plain letters in the search box either. Fold
   the diacritics off once, in the caches, and both lookups work. */
const fold = s => {
  const t = String(s == null ? "" : s);
  try {
    return t.normalize ? t.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : t;
  } catch (e) { return t; }
};

/* T9 lookup: match a contact by digits or by the letters on the keys */
const T9 = {2:"abc",3:"def",4:"ghi",5:"jkl",6:"mno",7:"pqrs",8:"tuv",9:"wxyz"};
const toDigits = s => fold(s).toLowerCase().split("").map(ch => {
  for (const k in T9) if (T9[k].includes(ch)) return k;
  return "";
}).join("");

/* the T9 digits of a name never change, but they were rebuilt for every
   contact on every keystroke; cache them per contact object instead */
const t9Cache = new WeakMap();
function t9Of(p) {
  let d = t9Cache.get(p);
  if (d === undefined) {
    d = toDigits(String(p.n == null ? "" : p.n));
    t9Cache.set(p, d);
  }
  return d;
}

/* the lower-cased name and the number string never change either, and both were
   rebuilt for every contact on every keystroke; cache them per contact object */
const lowCache = new WeakMap(), telCache = new WeakMap();
function lowerOf(p) {
  let s = lowCache.get(p);
  if (s === undefined) {
    s = fold(p.n).toLowerCase();
    lowCache.set(p, s);

    /* the bridge can already be gone (Activity torn down, page kept alive): an
       exception here left the tap with no effect at all and nothing to catch it */
    try {

    } catch (err) {
      window.location.href = "tel:" + d.replace(/#/g, "%23");

  } else if (MOBILE) {
    /* a bare "#" starts a URI fragment, so *123# and *#06# reached the system

    window.location.href = "tel:" + d.replace(/#/g, "%23");   // browser: hand off to the system dialer

  const secs = Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000));
  csStatus.textContent = String(Math.floor(secs / 60)).padStart(2, "0") + ":" +
                         String(secs % 60).padStart(2, "0");
}
function startCallTimer() {
  clearInterval(callTimer);
  /* the status sat on "calling…" until the first one-second tick, so the timer
     only showed up 3.6 s after dialling, and came back a second stale after
     returning from the background */
  paintCallTime();
  callTimer = setInterval(paintCallTime, 1000);
}

function startCall(number, person) {
  if (number.replace(/\D/g,"") === "" && !person) return;
  csName.textContent = person ? person.n : fmt(number);
  csStatus.textContent = "calling…";
  cs.classList.add("show");
  device.classList.add("calling");
  cs.setAttribute("aria-hidden","false");
  clearInterval(callTimer); clearTimeout(startCall.t);
  callStartedAt = 0;
  startCall.t = setTimeout(() => {
    if (!cs.classList.contains("show")) return;
    callStartedAt = Date.now();
    /* a call placed just before the app was backgrounded used to start the
       1 Hz timer while hidden; visibilitychange restarts it on return */
    if (!document.hidden) startCallTimer();
  }, 2600);
  if (navigator.vibrate) navigator.vibrate(10);
}
function endCall() {
  clearInterval(callTimer); clearTimeout(startCall.t);
  document.querySelectorAll(".cs-btn.on").forEach(b => b.classList.remove("on"));
  cs.classList.remove("show");
  device.classList.remove("calling");
  cs.setAttribute("aria-hidden","true");
}
$("csEnd").addEventListener("click", endCall);
document.querySelectorAll(".cs-btn").forEach(b =>
  b.addEventListener("click", () => b.classList.toggle("on")));
$("call").addEventListener("click", () => {
  if (!value) return;
  const m = findMatch();
  placeCall(value, m ? m.n : fmt(value));
});

/* ---------------- clock ---------------- */
const clockEl = $("clock");
function tick() {
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  h = h % 12 || 12;
  clockEl.textContent = h + ":" + m;
}
/* wake once a minute, right after the minute turns over, instead of every 15s forever */
let clockT = null;
function scheduleClock() {
  clearTimeout(clockT);
  const d = new Date();
  clockT = setTimeout(() => { tick(); scheduleClock(); },
    (60 - d.getSeconds()) * 1000 - d.getMilliseconds() + 25);
}
tick();
scheduleClock();

/* nothing on screen needs to tick while the app is in the background */
document.addEventListener("visibilitychange", () => {
  app.classList.toggle("still", document.hidden);
  if (document.hidden) {
    clearTimeout(clockT);
    clearInterval(callTimer);
    /* a finger held on a key when the app went away left its 500/600 ms timer
       running. It fired behind the hidden page and inserted a "+" into the
       number — or wiped it — with nothing on screen to show for it. */
    clearTimeout(pressT); pressT = null;
    clearTimeout(hold);
    clearTimeout(zeroHold);
    if (numAnim) { try { numAnim.cancel(); } catch (e) {} numAnim = null; }
    return;
  }
  tick();
  scheduleClock();
  if (cs.classList.contains("show") && callStartedAt) startCallTimer();
});

/* ---------------- install / offline ---------------- */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

(function installTip() {
  const card = $("install"), btn = $("installBtn"), x = $("installX");
  if (!card) return;
  /* the "x" was only wired up on the browser path, so inside the Android app the
     card came back on every launch with a dismiss button that did nothing and no
     way to get rid of it short of making Phone the default dialer */
  let off = false;
  try { off = localStorage.getItem("phone.installTip") === "off"; } catch (e) {}
  if (x) x.addEventListener("click", () => {
    card.classList.remove("show");
    try { localStorage.setItem("phone.installTip", "off"); } catch (e) {}
  });
  if (window.PhoneNative) {
    try { if (PhoneNative.isDefaultDialer()) return; } catch (e) { return; }
    if (off) return;
    $("installText").innerHTML = "Set <b>Phone</b> as your default dialer to get the in-call speaker, mute, hold and recording controls.";
    btn.hidden = false;
    btn.textContent = "Set";
    btn.addEventListener("click", () => {
      try { PhoneNative.requestDefaultDialer(); } catch (e) {}
      card.classList.remove("show");
    });
    card.classList.add("show");
    return;
  }
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (standalone || off || location.protocol === "file:") return;
  let prompt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; btn.hidden = false; });
  if (ios) {
    $("installText").innerHTML = "Tap <b>Share</b> then <b>Add to Home Screen</b> to keep Phone on your home screen.";
  }
  card.classList.add("show");
  btn.addEventListener("click", async () => {
    if (!prompt) return;
    prompt.prompt();
    await prompt.userChoice;
    card.classList.remove("show");
  });
})();

/* ---------------- liquid glass settings ---------------- */
(function glassSettings() {
  const dark = !matchMedia("(prefers-color-scheme: light)").matches;
  const DEF = { v: dark ? 58 : 45, blur: 22, sat: 200, edge: 100, glow: 100 };
  const PRE = {
    def: DEF,
    clear: { v: 90, blur: 10, sat: 230, edge: 150, glow: 100 },
    frost: { v: 22, blur: 42, sat: 160, edge: 80, glow: 60 }
  };
  const FIELDS = [
    ["v", "Transparency", 0, 100, 1, "%"],
    ["blur", "Blur", 0, 50, 1, "px"],
    ["sat", "Saturation", 100, 300, 5, "%"],
    ["edge", "Edge highlight", 0, 200, 5, "%"],
    ["glow", "Background glow", 0, 100, 5, "%"]
  ];
  let G = Object.assign({}, DEF);
  try { Object.assign(G, JSON.parse(localStorage.getItem("phone.glass") || "{}")); } catch (e) {}
  /* the stored values were written straight into custom properties, so a
     half-written or hand-edited entry like {"v":"abc"} set --g-a:NaN and took
     the backdrop blur out entirely. Coerce to a number and clamp to the slider. */
  FIELDS.forEach(([k, , lo, hi]) => {
    const raw = G[k];
    const n = (raw === null || raw === undefined || raw === "") ? NaN : Number(raw);
    G[k] = isFinite(n) ? Math.min(hi, Math.max(lo, Math.round(n))) : DEF[k];
  });
  const sheet = $("gsheet"), gear = $("gear"), rows = $("gsRows"), ins = {};

  /* a slider drag fires 'input' on every frame; writing localStorage on each
     one meant ~60 synchronous JSON writes a second while dragging */
  let saveT = null, slideQueued = false;
  function flush() {
    clearTimeout(saveT);
    saveT = null;
    try { localStorage.setItem("phone.glass", JSON.stringify(G)); } catch (e) {}
  }
  /* the 250 ms save timer was lost when the page was closed or backgrounded
     right after a drag, so the last slider position was never written */
  function flushIfPending() { if (saveT !== null) flush(); }
  addEventListener("pagehide", flushIfPending);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) flushIfPending();
  });

  function apply(save) {
    const r = document.documentElement.style;
    r.setProperty("--g-a", (0.8 * (1 - G.v / 100)).toFixed(3));
    r.setProperty("--g-blur", G.blur + "px");
    r.setProperty("--g-sat", G.sat + "%");
    r.setProperty("--g-edge", G.edge / 100);
    r.setProperty("--g-glow", G.glow / 100);
    FIELDS.forEach(([k, , lo, hi, , u]) => {
      const i = ins[k]; if (!i) return;
      i.el.value = G[k];
      i.el.style.setProperty("--p", ((G[k] - lo) / (hi - lo) * 100) + "%");
      i.out.textContent = G[k] + u;
    });
    if (save) {
      clearTimeout(saveT);
      saveT = setTimeout(flush, 250);
    }
  }
  FIELDS.forEach(([k, name, lo, hi, step]) => {
    const row = document.createElement("div");
    row.className = "gs-row";
    row.innerHTML = `<label for="gs-${k}">${name}</label><output></output><input id="gs-${k}" type="range" min="${lo}" max="${hi}" step="${step}">`;
    rows.appendChild(row);
    const el = row.querySelector("input"), out = row.querySelector("output");
    ins[k] = { el, out };
    /* a drag fires 'input' more than once per frame and every one of them
       repainted the glass; coalesce to one repaint per frame, as the contacts
       search box already does */
    el.addEventListener("input", () => {
      G[k] = +el.value;
      if (slideQueued) return;
      slideQueued = true;
      requestAnimationFrame(() => { slideQueued = false; apply(true); });
    });
  });
  document.querySelectorAll(".gs-pre button").forEach(b =>
    b.addEventListener("click", () => { G = Object.assign({}, PRE[b.dataset.p]); apply(true); }));

  function open(on) {
    const was = sheet.classList.contains("show");
    if (!on && was) flush();          /* closing commits the last slider value now */
    sheet.classList.toggle("show", on);
    gear.classList.toggle("on", on);
    sheet.setAttribute("aria-hidden", String(!on));
    if (navigator.vibrate && on !== was) navigator.vibrate(6);
  }
  gear.addEventListener("click", () => open(!sheet.classList.contains("show")));
  $("gsDone").addEventListener("click", () => open(false));
  document.addEventListener("pointerdown", e => {
    if (sheet.classList.contains("show") && !e.target.closest("#gsheet") && !e.target.closest("#gear") && !e.target.closest("#tabbar")) open(false);
  }, true);
  /* Escape used to call open(false) unconditionally, so every Escape press
     buzzed the phone even with the sheet already closed */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && sheet.classList.contains("show")) open(false);
  });
  apply(false);
})();

/* ---------------- boot ---------------- */
snap();
render();
/* a page can be created already hidden (restored in the background) */
app.classList.toggle("still", document.hidden);

/* real contacts and call history, when running inside the Android app */
function hydrateNative() {
  if (!window.PhoneNative) return;
  /* both lists are replaced even when they come back empty. Keeping the old
     ones whenever the new read was empty meant that revoking contacts access —
     or deleting every contact — left the previous list on screen, and a row
     from it still dialled a number the app could no longer read. A failed
     parse still leaves the current data alone. */
  let list = null, log = null;
  try { list = JSON.parse(PhoneNative.contacts() || "[]"); } catch (e) {}
  try { log = JSON.parse(PhoneNative.callLog() || "[]"); } catch (e) {}
  if (Array.isArray(list)) {
    people.length = 0;
    list.forEach(p => { if (p) people.push(p); });
  }
  if (Array.isArray(log)) {
    recents.length = 0;
    log.forEach(r => { if (r) recents.push(r); });
    /* The local dialled list only covers calls made since the last read, but it
       was never dropped once the device log knew about them too: Recents drew
       both rows, so every call placed from inside the app appeared twice — and
       stayed doubled across launches. The log is the authority (it evicts by
       recency, so a local call whose number is in the log is in the log), so
       the local copy goes. */
    if (recents.length) {
      const logged = new Set();
      recents.forEach(r => {
        const t = r && r.p ? String(r.p.t == null ? "" : r.p.t).replace(/\D/g, "") : "";
        if (t) logged.add(t);
      });
      if (logged.size) {
        const before = dialed.length;
        dialed = dialed.filter(d => !logged.has(String(d.number).replace(/\D/g, "")));
        /* only the in-memory list was trimmed, so storage kept every row the log
           already knew about. They came back — with their old times, at the top —
           as soon as the log rolled past them. Write the trimmed list back. */
        if (dialed.length !== before) {
          try { localStorage.setItem("phone.dialed", JSON.stringify(dialed)); } catch (e) {}
        }
      }
    }
  }
  buildContactIdx();
  renderFavs();
  /* re-reading the call log used to drop the Recents list back to All while the
     Missed pill stayed selected, so the filtered list showed outgoing calls */
  renderRecents(recentsFilter());
  renderContacts($("q").value || "");
  /* the keypad was never repainted after a data load. A number typed while the
     contacts were still being read — or before the permission result arrived —
     therefore showed no contact match under it, and kept the font size it had
     been given while the list was empty, until the next keystroke. */
  render();
}
/* the contact read, the JSON parse and a full re-render of every list used to
   run inside the page's first script pass, so nothing painted until all of it
   was parsed, rendered and laid out. Paint the keypad first, fill in on the
   next task. */
setTimeout(hydrateNative, 0);
/* the permission dialog result re-runs this instead of reloading the whole page,
   which used to replay the entrance animations and throw away a typed number */
window.__phoneHydrate = hydrateNative;

/* one re-measure per frame; also keeps the All/Missed capsule on the selected side
   instead of snapping it back to All when the fonts finish loading */
let remeasure = false;
function remeasureLayout() {
  if (remeasure) return;
  remeasure = true;
  tabMids = null;   /* the tab centres are about to move: drop the cached ones */
  numMaxW = 0;      /* and so is the width the number line fits into */
  fitOkLen = 0;     /* a narrower line fits fewer characters than the last one */
  requestAnimationFrame(() => { remeasure = false; snap(); fitNumber(); syncSeg(); });
}
addEventListener("resize", remeasureLayout);
if (document.fonts) document.fonts.ready.then(remeasureLayout);
syncSeg();
</script>
